# AI 辅助读源码：系统提升路线

主线是 **LLM 与 Agent 能力**：模型调用、结构化输出、工具、检索、LangChain/LangGraph、上下文工程、评估与可靠性，再到数据 Agent。语义建模与 Ossie 作为 AI 数据问答的支撑；Paimon、Flink、Spark 安排在后段，建立未来需要的数据系统基础。

**执行入口：[27 周学习目标参考版](02-路线图/00-总路线图.md)。** 周次表示学习顺序，不绑定日期；每周约 4–5 小时，按实际节奏顺延。现有项目和教程可提供练习素材，不决定知识顺序；工作成果满足当周验收时直接复用。

## 从哪里开始

第 1 周直接用 LangChain ChatModel 完成一次结构化信息抽取：观察消息、流式输出、原始响应与用量，并验证正常、缺字段、歧义三种输入。第 2 周在同一个助手中加入工具调用。每周的具体目标、最小练习与过关标准都在总计划中。

# AI 辅助读源码方法论

> 专题资料：文中原有周次与大型练习属于旧版排期；当前按 [27 周学习目标参考版](../02-路线图/00-总路线图.md) 选读，不叠加任务。

> 适用：Datus（Python / Agent 框架）、Paimon（Java / 存储）、Flink（Java / 分布式运行时）、Spark（Scala / 查询引擎）。
> 前提：你已学过 LangChain / LangGraph 的基础用法，统一计划第 3–5 周会把这块补到「能读源码、能造轮子」的程度。所以下面的方法从「大仓库怎么读」讲起，不再重复框架入门。

## 一、先说结论：AI 的三件正确用法和三种错误用法

**正确用法**

- **导航**：仓库几万行，AI 帮你定位「这个功能在哪个模块、哪个类、哪一行」，你只读该读的部分。
- **解释**：对一个方法/字段，AI 补上背景（设计约束、历史原因、上下游协议），把你从「语法看懂了但不知道为什么」里拉出来。
- **出题与找错**：让 AI 根据代码出题考你、检查你的笔记结论、设计最小复现实验。这是收益最高、也最容易被忽略的用法。

**错误用法**

- 让它「总结一下 Flink 的架构」——会得到一篇和官网博客没区别、且可能过期的东西。
- 一次丢一个大目录让它「讲讲」——上下文被稀释，回答又长又虚。
- 相信它给的类名和方法签名——大模型对老版本代码记忆很深，对新版本改动经常一本正经地编。

一句话：**AI 是陪你读源码的资深同事，不是替你读源码的替身。**

## 二、四层读法（每个仓库都按这个节奏走）

### L0 地图层：先知道「有什么」，不碰细节（0.5-1 天）

目标产出：一页纸架构图 + 模块职责表 + 一条「最小可运行路径」。

做法：
1. 只读 `README`、`docs/` 的 Overview、`pom.xml` / `pyproject.toml` 的模块划分。
2. 用提示词 P1 让 AI 生成仓库地图，**要求每个结论给出 `路径:行号`**，然后自己抽查 3 处。
3. 跑通官方 quickstart。跑不通就先解决环境，这一步没过，后面全是纸上谈兵。

判断标准：你能不看资料说出「这个项目由哪 5 个模块组成，数据从哪进、从哪出」。

### L1 骨架层：只追一条主链路（每个仓库 3-5 天）

目标产出：一张端到端调用链时序图，从用户入口到最终落点。

做法：
1. 选一条**最短、最常走**的链路。Flink 选「提交一个 WordCount 作业」，Paimon 选「Flink 写入一张主键表并提交 snapshot」，Datus 选「用户问一句 → 返回一个 SQL 答案」。
2. 用 P2 逐跳追问：每一跳的「输入是什么、谁调用谁、状态存在哪、失败会怎样」。
3. 每确认一跳，就把 `类名 + 方法名 + 文件:行号` 记进笔记，形成链条。**链条上的每一环都必须是你亲自打开文件看过的。**

判断标准：能对着白板从入口画到落点，中间不断线。

### L2 机制层：按问题深挖（每个项目挑 4-6 个专题）

骨架是一条线，机制是一个个「点」。每个点用一个**问题卡片**驱动，卡片结构固定：

```
问题：checkpoint 时如果某个算子一直不来 barrier 会怎样？
为什么问：线上遇到过 checkpoint 超时
读哪里：CheckpointBarrierHandler / CheckpointCoordinator 的超时逻辑
验收：能说出超时后作业的行为（失败？降级？）以及对应配置项
```

L2 的读法是**以状态变化为中心**，不是以文件为中心。读一个机制时固定问五个问题：

1. 输入是什么（消息、配置、外部事件）？
2. 内部有哪些状态（内存结构、文件、元数据）？
3. 状态怎么变（正常路径）？
4. 边界和异常怎么处理（超时、并发、重启、部分失败）？
5. 对外暴露什么（配置项、指标、日志、异常类型）？

这五个问题问完，一个机制才算读透。AI 在这里主要帮你做第 3、4 步——异常路径最容易被自己漏掉。

### L3 验证层：输出即检验（每篇笔记 0.5 天）

三种验证手段，按成本从低到高：

- **复述**：合上代码，用自己的话讲一遍链路，然后让 AI 挑错（P9）。讲不顺的地方就是没读懂的地方。
- **出题**：让 AI 基于代码出 5 道题（P5），答不上来的回头补。
- **实验**：写最小 demo 或加日志/断点实际跑一遍（P8）。涉及分布式状态的（checkpoint、snapshot、shuffle）尽量做，因为这类机制光看代码必然有理解偏差。

判断标准：你的笔记能让一个没读过这个项目的同事看懂，并且他能顺着笔记自己找到代码。

## 三、防幻觉纪律（硬性规则）

1. **版本锚定。** 进仓库第一件事：`git checkout` 到你要研究的 tag（如 `release-1.20`、`paimon-1.2`），并在每次对话开头告诉 AI「当前版本是 X」。训练数据里的老版本会系统地骗你。
2. **行号即证据。** 凡是「XX 在这里做的」结论，必须带 `文件:行号`。AI 给不出行号的结论，一律标 `[未验证]`。
3. **一次一问。** 一条链路、一个机制、一个类。跨模块的大问题拆成小问题串行问。
4. **交叉验证。** AI 说法 → 官方文档 → 代码注释 → 实际运行，至少对上两项才写进笔记。四者冲突时以代码和运行结果为准。
5. **警惕流畅。** 回答越顺畅、越像教科书，越要抽查。真正的源码细节往往是反直觉的。
6. **区分「设计意图」和「实现现状」。** AI 很擅长讲设计意图（因为文档里写了），但实现里可能有 workaround、兼容代码、TODO。读代码时专门留意 `TODO`、`FIXME`、`@Deprecated`、奇怪的 if 分支，那里往往藏着真实世界的约束。

## 四、环境准备（一次性，约半天）

**通用**

- 每个仓库单独克隆，建一个学习分支：`git checkout -b study/<tag>`，不要在你的工作分支上读。
- 在仓库根目录让 AI 生成 `CLAUDE.md`（或 `.cursor/rules`），内容包括：模块地图、入口类、构建命令、代码风格约定。**这份文件是后续所有会话的上下文底座**，比每次重新解释仓库高效得多。
- 笔记与代码分离：代码在 D 盘源码目录，笔记在本目录 `04-笔记/`，笔记里只放 `文件:行号` 和链接。

**Java 系（Flink / Paimon / Spark）**

- JDK 11/17（按项目要求）、Maven 3.8+，先跑 `mvn -DskipTests install` 确认能编译。编译不过的项目读起来会非常痛苦，因为无法跳转和调试。
- IDE 打开后等索引建完再开始；用 IDEA 的「Find Usages」和「Call Hierarchy」配合 AI 使用——AI 负责告诉你「去哪找」，IDE 负责「精确地找」。
- 装 Mermaid 插件，笔记里的时序图直接在 IDE 里预览。

**Python 系（Datus）**

- `uv` 或 `venv` 建独立环境，`pip install -e .` 可编辑安装，方便打断点。
- 用 `duckdb` 做本地数据源跑 demo，不要一上来接生产库。

**AI 工具的分工建议**

- **Claude Code / Cursor 在仓库内**：负责搜索、跳转、追链路、改代码做实验。能直接 grep 和读文件，幻觉最少。
- **网页版对话**：负责概念解释、对比阅读、帮你审笔记。适合贴片段，不适合贴大目录。
- **本地 grep 仍然是第一手段**：`rg "class CheckpointCoordinator"` 比问 AI 快且准。AI 的价值在「grep 之后怎么串起来」。

## 五、每周节奏（项目驱动版）

一周一个循环，每周至少产出一篇笔记：

| 时间 | 动作 | 产出 |
| --- | --- | --- |
| 周一 30 分钟 | 从 backlog 挑一个真实问题，写成问题卡片 | 问题卡片 |
| 周二-周三 | L1：追这条问题涉及的链路，每跳记 `文件:行号` | 链路草稿 + 时序图 |
| 周四 | L2：把这个机制的五个问题（输入/状态/变化/异常/对外）答完 | 机制说明 |
| 周五 | L3：复述 + 出题 + 最小实验；写笔记 | 一篇成文笔记 |
| 周五 20 分钟 | 更新 backlog：新问题入库，已解决的标结论 | backlog 更新 |

每 4 周做一次**横向对比**（1 小时）：比如「Paimon 的 snapshot 提交 vs Flink 的 checkpoint 完成」「Datus 的 agent loop vs LangGraph 的 StateGraph」。对比是检验理解最狠的方式，也是最能产出洞见的时刻。

## 六、读不同项目的差异化策略

- **Python 项目（Datus）**：代码量小、动态性强，重点不是读实现细节，而是**读出架构决策**——它为什么不用 LangGraph、context 怎么组织、工具怎么注册。读的时候多问「如果是我会怎么设计」。
- **存储格式（Paimon）**：核心是**元数据与文件布局**。先把「表 → snapshot → manifest → data file」的层次在纸上画清楚，再读代码。存储项目的代码是围绕这几个数据结构的 CRUD，看懂结构就懂了一半。
- **分布式运行时（Flink）**：最难的是**跨进程、跨线程的状态**。读的时候始终问「这段代码运行在 JobManager 还是 TaskManager？哪个线程？」。建议先读 `flink-runtime` 的部署与调度，再读 `flink-streaming-java` 的算子执行。
- **查询引擎（Spark）**：核心是**树变换**。Catalyst 的一切都是「Tree + Rule」，读的时候把每条 Rule 当成一个 `Tree → Tree` 的函数，重点看 rule 的匹配条件和幂等性。不要试图读完所有 rule，挑 5 条最常用的。

## 七、常见坑

- **一上来读最难的模块。** Flink 直接读 NetworkStack、Spark 直接读 Tungsten，三天就会放弃。永远从最短链路开始。
- **只读不跑。** 分布式系统的代码，不跑一遍几乎必然理解错。至少把 demo 跑起来加日志。
- **笔记写成代码摘抄。** 抄代码没有价值，笔记要写「为什么」和「链路」，代码只留 `文件:行号`。
- **让 AI 一次读整个文件。** 大文件（几千行的 Operator）要按方法读，让 AI 只解释你圈出的那一段。
- **忽略配置项和指标。** 配置项是设计意图的索引（有哪些开关说明有哪些路径），指标是运行时行为的索引。读机制时顺手记下相关配置和 metric 名，回填工作特别有用。
</script>

# 提示词库

用法：复制后把 `<尖括号>` 里的内容替换掉。所有提示词都默认带了「版本锚定 + 行号强制 + 不确定就说不确定」的约束，**不要删掉这几条**，它们是防幻觉的核心。

通用前置句（建议每段对话开头都带上）：

```
当前仓库：<repo>，版本：<tag/commit>。回答必须遵守：
1. 每个结论附 `文件路径:行号`；
2. 找不到依据时明确写「未在代码中找到」，不要猜；
3. 不确定的地方标注「推测」并说明理由；
4. 只回答我问的这一条链路，不要展开无关模块。
```

---

## P1 仓库地图（L0，每个新仓库跑一次）

```
你是我的源码阅读向导。请先只读 README、docs 的 overview 和构建文件，产出：
1. 模块清单表格：模块名 | 职责（一句话）| 主要目录 | 大概行数规模；
2. 一张 Mermaid 架构图，画出模块间依赖和数据流；
3. 「最小可运行路径」：从用户入口（CLI/API）到最核心逻辑的一条最短调用链，列出每一步的类和方法；
4. 列出 3 个最适合初读者的入口文件，并说明理由。
要求：每条结论给 `文件:行号`；不确定的地方标「推测」。最后告诉我，要理解这个项目，哪 3 个概念必须先搞懂。
```

产出直接存成仓库根目录的 `CLAUDE.md`：

```
把上面的结果整理成一份 CLAUDE.md，包含：项目定位、模块地图、核心抽象（5 个以内）、
构建与运行命令、代码风格约定、阅读入口。要简洁，作为后续所有对话的上下文底座。
```

## P2 调用链追踪（L1，最常用）

```
入口是 <类名.方法名>（文件:行号）。请追踪它在「<具体场景>」下的执行路径，要求：
1. 每一跳给出：调用方 → 被调方（类.方法）、文件:行号、这一跳做了什么、输入输出是什么；
2. 遇到接口/抽象类时，指出运行时实际的实现类是哪个，并说明你是怎么判断的；
3. 遇到多线程/异步（线程池、消息队列、RPC），单独标注「切换到了哪个线程/进程」；
4. 输出一张 Mermaid 时序图。
只追到 <你关心的落点，如：数据写入文件> 为止，不要继续往下展开。
```

变体：**反向追踪**

```
<某现象/字段/表> 是从哪里来的？请反向追踪它的写入点和赋值点，直到最上游的来源。
列出所有写入点，并说明哪个是主路径、哪些是兼容/修复路径。
```

## P3 机制解释（L2，配合五个问题）

```
请解释 <机制名> 的完整生命周期，按以下结构回答：
1. 触发条件：什么情况下会进入这个流程；
2. 状态：涉及哪些内存结构和持久化数据，分别存在哪；
3. 正常路径：分步骤描述，每步给 `文件:行号`；
4. 异常路径：超时、失败、并发冲突、重启时分别怎么处理，给 `文件:行号`；
5. 对外接口：相关配置项、指标名、日志关键字、抛出的异常类型。
最后指出：这段代码里有没有 TODO / FIXME / 特殊兼容分支？它们说明了什么约束？
```

## P4 对比阅读（每 4 周一次）

```
对比 <项目A的机制X> 和 <项目B的机制Y>，回答：
1. 两者要解决的问题是否相同？如果不同，各自真正的约束是什么？
2. 在数据结构/状态模型上的差异；
3. 在失败恢复上的差异；
4. 各自的取舍（性能/复杂度/一致性）分别偏向哪边；
5. 如果我所在的团队同时用两者，最容易踩的坑是什么？
每条结论给出两边的 `文件:行号` 作为依据。不要为了对称而强行类比。
```

可用对比清单：Paimon snapshot vs Flink checkpoint；Paimon LSM vs RocksDB；Datus agent loop vs LangGraph StateGraph；Flink 两阶段提交 vs Paimon 的 commit；Spark AQE vs Flink 动态调整并行度。

## P5 出题自测（L3）

```
基于 <机制名> 的实现，出 6 道题考我，难度递进：
2 道概念题（考状态模型）、2 道链路题（考调用顺序）、2 道故障题（给一个线上现象，问根因在代码哪一段）。
先只给题目，我答完再给评分和解析。解析必须引用 `文件:行号`。
```

## P6 生成图表

```
把 <链路/机制> 画成 Mermaid 时序图（参与者用真实类名），要求：
- 标注线程/进程边界（用 Note）；
- 标注状态变化点；
- 只画主路径，异常路径用 Note 说明。
如果信息不足以画完整，先列出缺失的信息点，不要编造参与者。
```

（状态机用 `stateDiagram-v2`，数据结构层次用 `classDiagram` 或缩进列表。）

## P7 代码考古（理解「为什么」的利器）

```
这段代码 <文件:行号> 看起来很奇怪 / 是 workaround。请：
1. 用 git log -L 和 git blame 找到引入它的 commit 和 PR；
2. 结合 commit message、PR 描述、关联 issue，解释当时要解决什么问题；
3. 说明今天的代码是否还受那个约束限制。
如果查不到历史，明确说「无历史记录」，不要用设计意图代替历史事实。
```

## P8 最小实验设计

```
我想验证 <机制> 的实际行为。请设计一个最小实验：
1. 环境：需要哪些依赖、用哪个版本、用什么数据源（优先 duckdb/本地文件）；
2. 代码：不超过 50 行的 demo，能触发这个机制；
3. 观察点：加哪些日志/断点/指标，期望看到什么，如果看到 X 说明理解正确；
4. 反例：怎样构造一个让机制走异常路径的输入。
给出完整可运行的代码，并说明每一步验证的是哪个假设。
```

## P9 审我的笔记（L3，写完必做）

```
以下是我的源码笔记。请只做三件事：
1. 找出与代码不符或缺少 `文件:行号` 支撑的结论；
2. 找出我漏掉的关键分支（尤其是异常路径和并发场景）；
3. 指出我写得含糊、别人看不懂的句子。
不要重写我的笔记，只列问题清单。
笔记：<粘贴>
```

## P10 版本差异阅读（升级/回填工作时用）

```
我在读 <项目> 的 <旧版本>，现在要升级到 <新版本>。请对比这两个版本在 <模块/机制> 上的差异：
1. 新增/删除/重命名的核心类；
2. 行为变化（默认值、协议、元数据格式）；
3. 兼容性影响；
4. 建议我优先读的 3 个新文件。
以两个版本的实际代码为准，不要凭记忆回答。
```

## P11 把源码结论翻译成工作语言

```
基于以上源码结论，帮我写一段给团队看的话：
1. 这个机制在我们的 <Flink/Paimon/Spark 集群> 上意味着什么；
2. 我们应该关注哪几个配置项和指标；
3. 出现 <某现象> 时，排查顺序是什么（按代码里的实际路径）。
用工程师能直接执行的语言，不要复述源码。
```

---

## 提示词使用纪律

- **P1 每个仓库只跑一次**，结果固化成 `CLAUDE.md`；之后每次会话让它先读这份文件。
- **P2 是主力**，一周里 70% 的对话应该是 P2 和 P3。
- **P5、P9 不要省**，它们是「以为读懂了」和「真读懂了」的分界线。
- 同一段对话不要超过 15 轮。话题切换就开新会话，避免上下文污染。
- AI 回答完，先做一件事：抽查它给的第一个 `文件:行号`。对不上，整段作废。
</script>

<script type="text/markdown" data-path="01-方法论/数据建模与语义建模知识框架.md" data-title="数据建模与语义建模知识框架" data-weeks="">
# 数据建模与语义建模知识框架

> 专题资料：文中原有周次与大型练习属于旧版排期；当前按 [27 周学习目标参考版](../02-路线图/00-总路线图.md) 选读，不叠加任务。

> 目标：把业务需求、模型设计、指标口径和 AI 消费串起来，形成可以解释、实现、验证的知识体系。
> 资料核对日期：2026-10-26。全部排期见 [统一学习计划](../02-路线图/00-总路线图.md)，具体案例见 [实践指南](../02-路线图/05-数据建模与Ossie实践指南.md)。

## 1. 为什么学 Ossie，以及学到哪里

Apache Ossie（孵化中，原名 Open Semantic Interchange）主要定义跨 BI、分析与 AI 工具交换语义模型的公共格式。它用 JSON/YAML 表达数据集、字段、关系、指标和 AI 上下文；模型转换器另在 apache/ossie-converters 仓库。

**适合用它学习统一业务语义、指标定义和模型互通；系统学习数据建模时，以业务与维度建模为主线，用 Ossie 表达并检验设计结果。** 阅读顺序是业务问题 → 粒度与关系 → 事实和维度 → 指标合同 → Ossie 表达 → SQL 验证。

项目依据：[README](https://github.com/apache/ossie)、[核心规范](https://github.com/apache/ossie/blob/a498fce5455dcc209605cdbb30b21e47068ff15e/core-spec/spec.md)、[转换器](https://github.com/apache/ossie-converters)。

## 2. 分层知识地图

| 层次 | 必须回答的问题 | 核心概念 | 学习产出 |
| --- | --- | --- | --- |
| 业务与概念模型 | 谁参与，发生什么，状态如何变化？ | 业务过程、实体、事件、关系、术语边界 | 业务流程图、概念关系图、术语表 |
| 逻辑模型 | 一行代表什么，怎样唯一标识，什么关系会放大行数？ | 粒度、自然键/代理键、基数、函数依赖、规范化取舍 | 逻辑关系图、主键与关系约束 |
| 维度模型 | 如何支持分析，如何保留历史？ | 星型模型、三类事实表、一致性维度、角色扮演维、SCD | 总线矩阵、事实/维度清单、历史处理规则 |
| 指标与语义模型 | 业务术语如何映射到稳定计算口径？ | 度量与指标、聚合、过滤、时间、去重、维度可用范围 | 指标合同、Ossie 模型、业务同义词 |
| 物理与加工实现 | 如何把逻辑模型落成可维护的数据表？ | 数仓分层、分区、主键更新、CDC、迟到、幂等、性能 | DDL、加工 SQL、更新和补数方案 |
| 验证与治理 | 如何发现口径错误，如何安全演进？ | 对账、质量约束、血缘、负责人、版本、兼容性 | 样例数据、断言 SQL、变更记录 |

逻辑关系设计与分析模型的目标不同。先理解实体约束，再解释为什么为分析采用星型结构；物理布局与湖表主键设计可回到 Paimon/Flink 主线继续深入。

## 3. 维度建模必须掌握的内容

以 [Kimball 官方技术目录](https://www.kimballgroup.com/data-warehouse-business-intelligence-resources/kimball-techniques/dimensional-modeling-techniques/)作为知识索引，按下面顺序总结，每条配一个自己的业务例子：

1. 四步设计：选择业务过程 → 声明粒度 → 确定维度 → 确定事实。
2. 事实表：事务事实表、周期快照、累积快照；解释为什么支付事件、每日余额、订单履约过程需要不同粒度。
3. 可加性：金额通常能在约定范围内相加；余额不能直接跨日期相加；比率应重新汇总分子和分母，避免平均百分比。
4. 维度：自然键与代理键、一致性维度、退化维、日期维和角色扮演维。
5. 历史：SCD Type 1 覆盖与 Type 2 增行；明确“按交易当时属性”还是“按当前属性”分析。
6. 多事实分析：支付和退款先各自聚合到共同粒度，再关联；避免直接把两侧明细连在一起后求和。
7. 工程边界：迟到事实、退款回溯、CDC 重放、去重与补数，怎样改变历史报表。

## 4. 指标合同：先写口径，再写表达式

每个指标至少记录：

| 项目 | 需要写清的内容 |
| --- | --- |
| 名称和业务目的 | 同名指标是否存在多个定义，服务什么决策 |
| 粒度与数据来源 | 输入粒度、输出粒度、源表/字段、关联路径 |
| 公式 | 分子、分母、去重键、单位、精度与舍入 |
| 纳入范围 | 成功/失败/取消状态、测试数据、退款是否计入 |
| 时间 | 事件时间或入仓时间、时区、统计窗口、截止时点 |
| 维度与历史 | 可用维度，历史属性或当前属性，允许怎样汇总 |
| 边界行为 | 空值、零分母、负值、重复事件、迟到与补数 |
| 验证与维护 | 期望结果、对账 SQL、负责人、版本与生效时间 |

例如“客单价”不能只写 AVG(amount)：先明确是订单金额、成功支付金额还是净支付金额，分母是全部订单还是成功支付订单；不同口径应分别命名。

## 5. Ossie 概念与建模结果的映射

| Ossie 元素 | 对应的设计结果 | 需要额外验证的事项 |
| --- | --- | --- |
| datasets / source | 逻辑数据集与物理表、视图或查询的映射 | 源数据是否真的符合声明粒度 |
| primary_key / unique_keys | 数据集唯一标识与候选键 | 声明唯一不代表真实数据没有重复 |
| fields / datatype / dimension | 字段、逻辑类型与分析维度角色 | 时间字段的值类型与时间角色需分别理解 |
| relationships | 数据集之间的连接定义 | 关系是否会放大行数、漏掉数据，需用数据验证 |
| datasets[].metrics / 根级 metrics | 单数据集和跨数据集指标 | 聚合粒度与过滤范围是否符合合同 |
| description / ai_context | 业务定义、同义词、使用说明与示例问题 | 描述准确性及 AI 是否真正使用这些信息 |
| custom_extensions | 核心规范以外的厂商信息 | 哪些消费者能理解，往返转换是否保留 |

**锁定版本的重要限制**：核心规范 0.2.0.dev0 中，指标表达式引用已声明的数据集字段，不能直接引用其他指标，也不能绕过字段声明直接引用 source 列。设计派生指标时，先形成业务依赖图，再按该版本允许的表达式或预计算字段实现，不套用其他语义层的语法。

Ossie 校验器会检查 Schema、名字、引用和相应 SQL 语法等问题；**校验通过不等于业务口径正确、数据主键唯一或查询结果正确**。仍需使用独立 SQL 和预期结果对账。

依据：[指标与名称解析规范](https://github.com/apache/ossie/blob/a498fce5455dcc209605cdbb30b21e47068ff15e/core-spec/spec.md)、[验证脚本](https://github.com/apache/ossie/blob/a498fce5455dcc209605cdbb30b21e47068ff15e/validation/validate.py)。

## 6. 用同一个案例贯穿学习

选择“订单—订单明细—支付—退款—客户—商品”。默认用合成数据练习，真实业务问题另在 backlog 中登记来源。

| 对象 | 示例粒度 | 需要研究的设计问题 |
| --- | --- | --- |
| 订单 | 一行一订单 | 下单时间、订单状态、取消订单是否纳入 |
| 订单明细 | 一行一订单行 | 商品维度；订单级金额怎样分摊，是否具备可靠依据 |
| 支付 | 一行一支付事件 | 多次支付、成功状态、重复回调、支付时间 |
| 退款 | 一行一退款事件 | 多次退款、跨日退款、退款归因与截止时间 |
| 客户维度 | 一行一客户版本 | 业务键、代理键、有效时间区间 |
| 商品维度 | 一行一商品版本或当前商品 | 历史类目变化按何种口径分析 |

至少区分两种时间视角：订单批次截至某时点的累计净支付，与某个自然日的支付减退款现金流。它们回答不同问题，结果不应强行对齐。

## 7. 与现有源码主线的联系

- Datus：研究业务语义如何进入检索和上下文，比较只有表结构与增加指标定义后的查询结果。是否支持 Ossie 原生导入需要核对锁定版本，不能预设。
- Paimon：研究主键更新、changelog、snapshot 怎样支撑模型的状态与历史需求；存储主键与业务实体标识需要分别定义。
- Flink：研究事件时间、watermark、去重与迟到修正怎样影响指标结果。
- Spark：用批处理对账 SQL 复核指标，学习关联与聚合计划。

## 8. 资料与学习边界

- [Ossie 官方仓库](https://github.com/apache/ossie)：定位、规范和工具入口。
- [TPC-DS 示例](https://github.com/apache/ossie/blob/a498fce5455dcc209605cdbb30b21e47068ff15e/examples/tpcds_semantic_model.yaml)：观察事实、维度、关系和指标的表达。
- [关系语义](https://github.com/apache/ossie/blob/a498fce5455dcc209605cdbb30b21e47068ff15e/core-spec/relational_semantics.md)与[表达式语言](https://github.com/apache/ossie/blob/a498fce5455dcc209605cdbb30b21e47068ff15e/core-spec/expression_language.md)：在核心格式之后阅读。
- [路线图](https://github.com/apache/ossie/blob/a498fce5455dcc209605cdbb30b21e47068ff15e/ROADMAP.md)：区分已实现、讨论中和计划中的能力。
- [Kimball 官方技术目录](https://www.kimballgroup.com/data-warehouse-business-intelligence-resources/kimball-techniques/dimensional-modeling-techniques/)：维度建模主线。

Ossie 的 0.2.0.dev0 是开发草案，学习锁定完整 commit；不要把 roadmap 当已实现能力。完整版本与转换器子模块差异见 `02-路线图/00-版本锁定.md`。

# AI 能力提升路线：27 周参考版

> 2026-10-26 重构。目标是系统提升 AI 应用与 Agent 工程能力；语义层和数据系统是后续支撑能力。周次是**学习顺序参考**，不绑定日历；某周没有达到验收就顺延。建议每周 4–5 小时，可因工作强度减半并拉长总周期。
> 本计划以“先理解机制，再实现最小例子，再验证边界”为原则。当前项目可提供练习材料，但不决定课程顺序。已有工作产出满足当周验收时直接复用，不重复造一份。

## 1. 能力目标与范围

学完后应能独立完成三件事：

1. **设计 AI 应用**：选择模型调用、结构化输出、工具、检索、状态和人工介入方式，解释取舍。
2. **验证与改进 Agent**：能追一条真实执行链，建立小型评估集，定位上下文、工具、模型或业务口径错误，并验证修改。
3. **理解数据底座**：知道语义模型怎样约束数据问答，知道 Paimon、Flink、Spark 如何影响数据的版本、实时性和查询结果。

主线顺序是 **LLM 基础 → Agent 组件与框架 → 上下文/评估/工程化 → 数据 Agent → 语义层 → 湖表/流/批**。前 13 周以 AI 为主；第 14–15 周学习语义建模与 Ossie；第 16–27 周系统补齐 Paimon、Flink、Spark 的存储、流计算和批查询能力。第五阶段仍服务于 AI 数据应用的可信数据底座；不要求通读引擎源码。

## 2. 每周固定节奏

每周约 4–5 小时：概念与官方资料 1 小时，动手 2 小时，读一条源码或运行链 1 小时，闭卷复述与记录 30–60 分钟。每周只交一份短成果：一张图、一段可运行例子、一张对照表或一页问题结论。读源码以当周问题为界，不按文件夹通读。

**快进规则**：每周开始先用 20–30 分钟直接做该周的过关标准。若能闭卷解释并拿出已有代码、运行或测试证据，就标“已掌握”并进入下一周；不必再花满 4–5 小时。27 周是知识模块参考，不要求真的用满 27 个自然周。

实践从 **LangChain** 的 ChatModel、工具和检索组件开始，逐步演进为一个小 AI 助手：有本地知识片段、少量结构化数据和 2–3 个只读工具。可从已有教程样例复制最小骨架，也可用现有项目中的脱敏场景。每周只增加当前概念需要的一点能力；无需另建完整业务系统。模型调用、工具、检索和评估尽量复用同一组 5–10 个问题，方便比较前后变化。

## 3. 逐周目标

### 第一阶段：用 LangChain 串起模型、工具与检索（第 1–3 周）

已有基础概念直接通过运行框架例子来检验。三周始终使用同一个 LangChain 小助手；只有当运行结果解释不清时才回查 token、采样、消息协议和结构化输出概念。

配套的[阶段一考点与实践题](06-阶段一考点与实践题.md)按咕泡固定样例设置了闭卷题、运行输入、验收条件；第 1–2 周可以合并连续完成。

| 周 | 学习目标 | 当周最小练习 | 过关标准 |
| --- | --- | --- | --- |
| 1 | 用 LangChain ChatModel 掌握消息、`invoke`/`stream`、结构化输出与用量记录 | 给一个信息抽取问题定义 schema；用正常、缺字段、歧义三种输入运行，保留原始 AIMessage、解析结果与用量/耗时 | 能解释模型原始响应与程序验证结果的区别；知道流式输出何时可用、失败时应重试还是澄清 |
| 2 | 理解 LangChain 工具定义、tool call、ToolMessage 与 Agent 循环 | 给同一助手加两个本地只读工具，让模型选择并读取返回值 | 能画出模型提出调用 → 程序校验/执行 → ToolMessage → 模型回答，并说明停止条件 |
| 3 | 用 LangChain 检索组件完成最小 RAG 闭环 | 给同一助手加一小组自备文档，设计 5 个已知答案问题，对比无检索与有检索 | 能区分检索漏召回、引用错文档和模型编造三类错误 |

### 第二阶段：LangChain / LangGraph 运行机制（第 4–7 周）

| 周 | 学习目标 | 当周最小练习 | 过关标准 |
| --- | --- | --- | --- |
| 4 | 理解 Runnable 组合、批处理、流式传播与调用事件 | 把第 1–3 周的两个步骤组合成链，比较单次调用、批处理和事件流 | 能解释数据在各组件间如何传递，以及流式输出在哪一段真正产生 |
| 5 | 理解 `create_agent` 的循环及工具注册 | 在最小 Agent 中加入第 2 周两个工具，读一条真实执行记录与对应入口源码 | 能区分框架负责的循环和自己负责的工具、约束、结果校验 |
| 6 | 理解 StateGraph、状态更新、条件边和 reducer | 画一个三节点小图：判断 → 查询 → 回答；让两个节点更新同一状态并观察合并 | 能解释一次“步”之后状态如何变化，以及并发更新为何需要明确规则 |
| 7 | 理解 checkpoint、中断、恢复与副作用 | 给小图加内存持久化和一次人工确认；中断后恢复，记录哪些节点再次执行 | 能区分图状态恢复与外部工具幂等；说出至少一个重复执行风险 |

### 第三阶段：Agent 提高与质量保障（第 8–11 周）

| 周 | 学习目标 | 当周最小练习 | 过关标准 |
| --- | --- | --- | --- |
| 8 | 学会上下文工程：选择、排序、裁剪、记忆与证据分离 | 对同一组问题比较“全量上下文”和“按需检索/摘要”两种输入 | 能指出被省略的关键信息、节省的成本及可能的错误 |
| 9 | 建立评估方法与错误归因 | 固定 8–10 个问题，记录期望工具行为、答案要点、实际结果和错误类别 | 改提示词或工具后可重跑并判断是否真的变好，而非只看一次好答案 |
| 10 | 学会工程边界：超时、重试、工具异常、可观测性、人工介入 | 人为制造 3 类故障，记录系统行为、日志与给用户的结果 | 能区分可自动重试、需模型修正、需用户澄清的故障 |
| 11 | 综合设计一次可复核的 Agent | 用前面的同一助手完成一个完整问题：检索/工具 → 回答 → 证据 → 评估 | 交一页架构图和评估结果，说明当前最主要的两个改进点 |

### 第四阶段：数据 Agent 与语义层（第 12–15 周）

| 周 | 学习目标 | 当周最小练习 | 过关标准 |
| --- | --- | --- | --- |
| 12 | 读懂数据 Agent 的一问一答主链路 | 在 Datus 的固定版本追“问题 → 上下文 → SQL/工具 → 执行 → 回答”一条链 | 有带源码位置的时序图；能解释哪里限制了执行与错误重试 |
| 13 | 比较数据 Agent 的上下文策略与质量控制 | 用同一小数据集比较“只有表结构”和“补充业务定义”两组问题；对照 Datus 一个实现点 | 能指出至少一种语义缺失导致的错误和一种程序层可阻止的错误 |
| 14 | 掌握数据问答必需的业务语义：粒度、关系、指标口径、时间 | 为一个小数据集写 2 个指标定义与 SQL 标准答案，故意制造一次 JOIN 重复计数 | 能解释自然语言问题为何需要指标合同，且 SQL 结果可复核 |
| 15 | 了解 Ossie 能表达什么及其边界 | 读核心规范和一个示例，把第 14 周的 dataset/field/relationship/metric 映射到 Ossie 草图 | 能区分“模型格式校验通过”与“业务结果正确”；如无互通需求，做到概念映射即可 |

Themis 语义层实践可作为第 14–15 周的**例子**，但不改变前面 AI 主线顺序。Ossie 只做一遍核心模型，不安排转换器往返、全量 YAML 实现或另一套大型订单数据。

### 第五阶段：数据系统能力深化（第 16–27 周）

这一阶段从“表上是什么数据”走到“数据何时可见、失败后怎样恢复、不同引擎为何可能得到不同结果”。它是未来能力储备，按 **Paimon 存储 → Flink 计算 → Spark 查询 → 端到端对账** 的依赖顺序推进。练习复用第 14 周的小数据集与指标口径；不能本地运行某个集群环节时，用官方示例、固定版本源码和明确的状态推演完成该周验收，标注未运行部分。

进入本阶段前先自测四个基础概念：**分区与并行度、LSM/compaction、列式文件、快照与一致性**。若某项讲不清，先用 1–2 小时补对应官方概念页，再进入当周；这段补课不单独制造项目。

#### Paimon：表与快照（第 16–18 周）

| 周 | 学习目标 | 当周最小练习 | 过关标准 |
| --- | --- | --- | --- |
| 16 | 理解追加表与主键表、schema、分区、bucket、业务键与更新键 | 为同一小数据集设计一张事件追加表和一张实体主键表，写出为何选这种表 | 能解释两种表的行语义、主键冲突与分区/bucket 对读写的影响 |
| 17 | 理解 snapshot → manifest → data file、提交可见性与时间旅行 | 画两次写入后的文件与快照关系；可运行时读取指定 snapshot | 能说明一个批读查询读到的是哪个表版本，旧文件何时仍被历史快照需要 |
| 18 | 理解写入/提交、compaction、merge-on-read 与 changelog 的取舍 | 让同一主键更新两次，比较最新查询结果、增量变化和 compaction 前后的文件变化；选一条写入或读取源码链 | 能区分逻辑结果、物理文件和下游收到的变更；说明小文件、读放大与写放大的关系 |

#### Flink：运行时、状态与一致性（第 19–23 周）

| 周 | 学习目标 | 当周最小练习 | 过关标准 |
| --- | --- | --- | --- |
| 19 | 理解 Client、JobManager、TaskManager、slot，以及 StreamGraph → JobGraph → ExecutionGraph | 从一个小作业画提交和图转换路线，标出并行度与资源申请位置 | 能解释用户代码如何变成可部署的任务，slot 不足时卡在哪一步 |
| 20 | 理解 StreamTask、OperatorChain、mailbox、网络交换和反压 | 跟踪一条记录穿过两个算子；人为设想或制造慢 sink，观察吞吐与反压指标 | 能指出记录在哪个进程/线程处理，反压如何向上游传递 |
| 21 | 理解 keyed/operator state、timer、事件时间、watermark 与迟到数据 | 用乱序事件推演窗口/聚合结果，再与一个最小作业或官方示例对照 | 能区分处理时间和事件时间，并说清迟到事件何时被接纳、丢弃或修正 |
| 22 | 理解 checkpoint barrier、对齐/非对齐、状态快照、ack、完成通知和恢复 | 画 JM/TM 双泳道时序图；从一次故障或示例推演恢复与外部副作用 | 能解释 exactly-once 的条件和边界，区分 checkpoint、savepoint 与业务事件去重 |
| 23 | 理解 Flink SQL 动态表的 `+I/-U/+U/-D`、sink 提交与 Paimon 可见性 | 用一条更新流推演聚合 changelog，再画出 Flink checkpoint 到 Paimon snapshot 的关联 | 能解释“作业处理了记录”与“批读者看到更新”之间的时间差和失败边界 |

#### Spark：查询、性能与跨引擎对账（第 24–26 周）

| 周 | 学习目标 | 当周最小练习 | 过关标准 |
| --- | --- | --- | --- |
| 24 | 理解 SQL 解析、分析、优化、物理计划与执行 | 对一条关联聚合 SQL 查看 `EXPLAIN`，标出 scan、filter、join、aggregate | 能从计划解释查询为何这样执行，以及字段或关系错误在哪一步暴露 |
| 25 | 理解 shuffle、join 策略、分区、数据倾斜和 AQE | 比较两种数据分布/连接方式的执行计划，记录一个性能差异 | 能判断慢查询主要是扫描、shuffle、倾斜还是不合适的 join 策略 |
| 26 | 理解 Spark 读取 Paimon 的 snapshot 与跨引擎对账 | 固定数据版本和截止时点，用 Spark SQL 复算第 14 周指标；条件允许时与 Flink 输出比较 | 能逐项归因口径、迟到更新、snapshot 和 SQL 实现造成的差异 |

#### 综合复盘（第 27 周）

| 周 | 学习目标 | 当周最小练习 | 过关标准 |
| --- | --- | --- | --- |
| 27 | 串起“AI 问答 → 语义定义 → Flink 更新 → Paimon 版本 → Spark 查询” | 用一张总图、一条指标合同和一次对账记录说明数据从产生到被 AI 使用的过程 | 能说明答案的业务口径、数据版本、时间边界和可信证据；列出下一轮最值得深入的 2 个机制 |

每周仍只保留一个最小产出。第 18、22、23、26 周容易因环境或机制复杂而延长，验收未过就顺延；无需把 12 周压缩成 4 周，也不需要为了填满 12 周重复已经掌握的内容。

## 4. 阶段检查与调整

- 第 3 周：能独立解释“模型回答、工具执行、检索证据”三者的边界。
- 第 7 周：能解释一个 Agent 的状态变化与中断恢复。
- 第 11 周：有可重跑的最小 Agent 与评估记录，能做一次有证据的改进。
- 第 15 周：能说明语义定义如何影响数据问答，知道 Ossie 的作用边界。
- 第 18 周：能解释 Paimon 的表版本、更新与读写取舍。
- 第 23 周：能解释 Flink 状态、时间、checkpoint 与 Paimon 提交的关联。
- 第 27 周：能固定业务口径、数据时点和 snapshot 做一次跨引擎对账，画出 AI 问答的数据证据链。

时间不足时保留每周的**过关标准**，减少阅读量或将一周拆成两周；不要为赶进度跳过验证。已有工作实践能满足标准时，附链接和一句解释即可。深入某个项目时再进入原[LangChain/LangGraph](00-前置-LangChain-LangGraph巩固路线.md)、[Datus](01-Datus源码阅读路线.md)、[Paimon](02-Paimon源码阅读路线.md)、[Flink](03-Flink源码阅读路线.md)、[Spark](04-Spark源码阅读路线.md)专题指南；专题中的旧周次和大作业不叠加到本表。

# 数据建模与 Ossie 实践指南

> 专题资料：文中原有周次与大型练习属于旧版排期；当前按 [27 周学习目标参考版](../02-路线图/00-总路线图.md) 选读，不叠加任务。

> 本文提供统一学习计划所需的练习、参考答案与规范阅读指引。全部周次以 [总学习计划](00-总路线图.md) 为准。
> 使用位置：第 1–2 周完成建模与 SQL 基线，第 6 周完成 Ossie 表达，第 9 周接入 Datus 并验证转换，第 22 周做最终对账与 AI 回归。
> 知识索引：[数据建模与语义建模知识框架](../01-方法论/数据建模与语义建模知识框架.md)。版本：[版本锁定](00-版本锁定.md)。

沿用同一套订单、支付、退款、客户与商品数据，逐步迁移到 Paimon、Flink 和 Spark。最终成果统一放在 `04-笔记/贯穿案例/`，章节说明见总学习计划；文中的自建 YAML 路径也指向该目录。上游 checkout、缓存、环境与调用记录放在 `D:\hy\codex\ai-source-learning\unified-study` 下，按用途分目录。

## 1. 业务边界和指标合同

1. 选择订单、订单明细、支付事件、退款事件、客户、商品；逐个写“一行代表什么”，不能只列字段。
2. 对每个关系写出两端是否唯一、是否允许缺失、会不会增加行数。
3. 完成至少 5 个指标合同：成功支付金额、成功退款金额、净支付金额、成功支付订单数、每成功支付订单净额。模板见知识框架。
4. 写清订单批次、截止时点、支付/退款事件日期、时区、状态、去重键和零分母策略。
5. 讨论商品维度：支付只有订单级金额时，不能直接声称可按商品分析；需要先定义并验证分摊规则。

闭卷问题：订单金额、支付金额、净支付金额何时不同？支付事实的主键为什么通常不是 order_id？“客户”与“客户的某个历史版本”有什么区别？

## 2. 最小案例、标准答案与边界验证

基础案例全部金额单位为元、统一用 DECIMAL；时区 Asia/Shanghai。订单 A/B/C 均在 2026-10-01 创建，订单批次取当天；截止时点是 2026-10-03 00:00:00（不含）。只纳入成功支付和成功退款，所有事件均有独立 ID。

| 订单 | 订单状态 | 10 月 1 日成功支付 | 10 月 2 日成功退款 |
| --- | --- | --- | --- |
| A | 已支付 | P1=60，P2=40 | R1=10，R2=20 |
| B | 已支付 | P3=50 | 无 |
| C | 已取消 | 无 | 无 |

标准答案：截至截止时点，成功支付金额 150，成功退款金额 30，净支付金额 120，成功支付订单数 2，每成功支付订单净额 60。退款金额率 30/150=20%；有退款的已支付订单占比 1/2=50%，两者不能混用。

对比错误路径：A 的 2 条支付关联 2 条退款产生 4 行，支付被算成 200、退款被算成 60。正确路径是按订单分别汇总支付与退款后再关联；保留订单 B，退款额补 0。C 不进入成功支付订单数的分母。

时间口径对比：按事件日计算现金流净额，10 月 1 日为 150，10 月 2 日为 -30；截至截止时点的订单批次净额为 120。不要把跨日退款直接改写成原支付日退款而不说明回溯规则。

在基础案例通过后，每次只改变一个条件，至少完成下面 8 项并用查询结果断言：

- 重复支付回调：同一事件 ID 重放后金额不变。
- 失败支付：有金额但状态失败，不纳入成功支付金额。
- 无退款订单：左关联后仍保留，退款为 0。
- 截止时点边界：等于截止时点的事件排除，之前的纳入。
- 零分母：没有成功支付订单时约定返回 NULL，而不是报错。
- 迟到退款：区分事件时间和入仓时间，说明何时重算历史结果。
- 客户 SCD2：有效期采用左闭右开；边界上的交易只能匹配一个版本。
- 不同组大小下的比率汇总：重新汇总分子/分母，与直接平均比率对比。

每个断言写明输入变化、预期值、实际值和结论。先在 SQLite（金额用整数分）或本地 DuckDB（DECIMAL）中选一个执行，不引入湖仓集群作为前置条件。三类事实表先完成设计比较，只实现支付/退款事务事实和指标所需最小视图即可。

## 3. 从规范到可校验模型

阅读顺序：

1. `README.md`：项目边界与模型交换目标。
2. `core-spec/spec.md`：datasets → fields → relationships → metrics → 名称解析。
3. `core-spec/ossie-schema.json`：必填项、类型、嵌套结构。
4. `examples/tpcds_semantic_model.yaml`：抽取一个销售事实和客户/商品/日期维度，逐项解释。
5. `core-spec/relational_semantics.md`、`core-spec/expression_language.md`：关系与计算规则，不把格式声明当查询执行承诺。
6. `validation/validate.py` 与相应测试：追 `main → validate_file → validate_document`，再按该 commit 实际调用定位检查函数，记录文件与行号。

环境准备：核心验证脚本声明 Python >=3.11；在独立实验虚拟环境中按脚本声明安装 pyyaml、jsonschema、sqlglot，记录实际解析后的依赖版本。完整环境和运行日志放在 scratch 根目录下，不写入上游源码目录。

```powershell
# 当前目录为锁定 commit 的 Ossie checkout；$studyPython 为实验虚拟环境的 python 路径
& $studyPython validation/validate.py examples/tpcds_semantic_model.yaml
& $studyPython validation/validate.py 'D:\hy\读书笔记\AI读源码\04-笔记\贯穿案例\实验\订单支付退款.semantic.yaml'
```

需要负向验证：错误类型、重复名字、字段引用不存在等案例能被检测；“数据中的重复支付事件”则由第 2 周建立的 SQL 断言检测，不交给 Schema 校验。

实现提醒：该锁定版本的指标引用声明字段，不能直接引用其他指标。必要时先在 SQL 视图中形成经过验证的字段/公共粒度，再建立语义映射。模型中的 description 与 ai_context 必须来自已明确的合同。

## 4. 转换与 AI 对照实验

### 转换实验

- 选择与你现有工具接近的一个转换器（优先 dbt；没有对应环境时选择能本地生成文件的转换路径，按其 README 确认方向与依赖）。
- 转换器固定到版本锁定表的 commit，其 ossie 子模块保持该仓库记录的 commit。它与第 6 周使用的核心版本不同，先比较 Schema；必要时显式迁移副本，保留迁移记录。
- 正向导出、再导回，逐项比较主键、字段类型、表达式、关系、description、ai_context、custom_extensions。
- 转换器不支持双向时，记录限制并增加一个支持所需方向的转换器，完成一次真实往返；不得用手工重写冒充往返。
- 用同一份测试数据和指标合同验证转换后的结果；只有文件生成且未运行目标查询时，明确标为“结构验证，执行未验证”。

### AI 上下文实验

- A 组：只有相同数据源的表结构。
- B 组：同一表结构，加已验证的业务定义、关系说明、指标口径、时间边界和同义词。
- 固定模型版本、参数、数据快照、问题顺序与工具权限。第 9 周执行 10 题 × 2 组 × 1 次，共 20 次，记录 SQL、结果和错误归因；第 22 周在最新数据快照重跑同一题集。时间允许时各补到 3 次以观察一致性，这部分列为选修。小样本用于学习诊断。
- 10 题至少覆盖：支付总额、退款总额、净支付、成功支付订单数、每订单净额、退款金额率、订单退款占比、跨日退款、商品分摊歧义、客户历史属性。
- 按结果数值、过滤状态、时间口径、关联粒度、无法回答时是否澄清逐项评分，比较通过率和重复运行的一致性，不以 SQL 看起来合理作为正确标准。
- 优先使用锁定的 Datus；先核对是否有 Ossie 原生接入。没有则将模型整理成其支持的上下文格式，记录适配路径；Ossie 不是模型执行引擎，也不保证能被任意 Agent 自动读取。

## 5. 验收清单

- 能闭卷画出“业务过程 → 事实与维度 → 指标 → Ossie → BI/AI”的链路，并解释各层职责。
- 至少 5 个指标合同完整，基础案例及 8 项边界 SQL 验证通过。
- 至少一份自建模型通过锁定版本校验，负向案例有效；验证记录附命令、版本、日期和结果。
- 有一次真实模型往返的差异报告；未执行验证的部分有明确状态。
- 有 10 题的 AI 对照记录和错误归因，能提出至少一个可迁移到工作的改进建议。
- 笔记中的规范结论有锁定源码位置；未运行部分标记“待验证”，完成后再更新 `04-笔记/README.md`。

需要压缩时按总计划缩减选修内容，保留粒度、指标合同和 SQL 对账。Ossie 全仓通读不作为完成条件。

## 6. 官方资料

- [核心规范（固定提交）](https://github.com/apache/ossie/blob/a498fce5455dcc209605cdbb30b21e47068ff15e/core-spec/spec.md)
- [TPC-DS 示例（固定提交）](https://github.com/apache/ossie/blob/a498fce5455dcc209605cdbb30b21e47068ff15e/examples/tpcds_semantic_model.yaml)
- [验证脚本（固定提交）](https://github.com/apache/ossie/blob/a498fce5455dcc209605cdbb30b21e47068ff15e/validation/validate.py)
- [转换器仓库（固定提交）](https://github.com/apache/ossie-converters/tree/bc4eb5d051dcc1825d90aea7f0c2c4cf89015d3c)
- [Kimball 维度建模技术目录](https://www.kimballgroup.com/data-warehouse-business-intelligence-resources/kimball-techniques/dimensional-modeling-techniques/)
</script>

<script type="text/markdown" data-path="02-路线图/00-前置-LangChain-LangGraph巩固路线.md" data-title="LangChain / LangGraph 巩固提高路线" data-weeks="">
# LangChain / LangGraph 巩固提高路线（3 周）

> 专题资料：文中原有周次与大型练习属于旧版排期；当前按 [27 周学习目标参考版](../02-路线图/00-总路线图.md) 选读，不叠加任务。

> 定位：不是把 `Langchain1.0-Langgraph1.0-Learning-main` 的教程再刷一遍，而是补上「基础」和「提高」之间的三段差距——抽象层、运行时、工程化。
> 这一阶段同时是读 Datus 的热身：你在这里读懂了 LangGraph 的运行时，读 Datus 时才有对照物。
> 版本锚定：`langchain==1.3.9`、`langchain-core==1.4.9`、`langgraph==1.2.16`（锁定原因与切换命令见 `00-版本锁定.md`）。

> 统一排期：第 3–5 周，具体目标与交付见 [总学习计划](00-总路线图.md)。本文件提供配套阅读与练习。

## 先诊断：基础薄弱通常缺的是这三样

1. **抽象层**：会用 `prompt | model | parser`，但说不清 `Runnable` 是怎么把任意函数变成可组合管道的；会用 `bind_tools`，但不知道工具描述是怎么序列化进请求的。
2. **运行时**：会画 `StateGraph`，但说不清「一步」到底怎么执行、状态怎么合并、checkpointer 什么时候写盘。
3. **工程化**：能跑通 demo，但没做过评估、重试、流式、人在回路、可观测性这些「上生产」的环节。

对症下药，每周补一样。判断标准不是「看完了」，而是**能徒手写出来**。

## Stage 1（第 3 周）：LangChain 抽象层

**主动回忆练习**（本周约 1.5 小时，不查文档）：把已有的 phase1/phase2 练习挑 3 个，关掉仓库、关掉文档，从空白文件重写。写不出来的地方就是漏洞。

**源码精读**（挑 3 个文件，不求读全）：

- `langchain_core/runnables/base.py`：`Runnable`、`RunnableSequence`、`RunnableParallel`、`RunnableLambda`。搞清楚 `invoke / batch / stream / astream_events` 四套方法是怎么统一的，为什么管道能自动支持流式。
- `langchain_core/language_models/chat_models.py`：`BaseChatModel` 的调用路径，`bind_tools` 把工具塞到了请求的哪个字段。
- `langchain_core/tools/base.py`：`@tool` 装饰器做了什么，参数 schema 从哪来，工具调用结果怎么回填成 `ToolMessage`。

**产出**：
- 一个 300 行左右的 `mini_chain.py`，实现 `Runnable` 风格的 `|` 组合、`invoke`、`stream`，能跑一个「prompt → model → 解析」的链路。
- 笔记《Runnable 是怎么把函数变成可组合管道的》。

## Stage 2（第 4 周）：LangGraph 运行时

这是最重要的一周。LangGraph 1.2 是 LangChain 1.3 的运行时底座，读懂它，`create_agent` 和 middleware 就都是「上面的糖」。

**按这条线读**：

```
StateGraph（图定义）
  → Pregel（超步执行模型：plan → execute → update）
  → Channel / Reducer（状态怎么合并，为什么默认是覆盖、什么时候要 add_messages）
  → Checkpointer（每个超步后写什么、存在哪、如何 resume）
  → interrupt / Command（人在回路怎么暂停和恢复）
  → Subgraph / Send（子图和动态并行）
```

**源码入口**（版本以你安装的为准）：`langgraph/graph/state.py`、`langgraph/pregel/`（`loop.py` 是核心）、`langgraph/checkpoint/`。

**动手**：
- 用 LangSmith 跑一次多轮对话 + 一次 interrupt，把 trace 里每个 span 和源码里的调用对上。**trace 是最好的源码地图**。
- 写一个 200 行的 `mini_graph.py`：支持节点、边、条件边、状态 reducer、内存 checkpointer。

**产出**：
- 笔记《LangGraph 的一步是怎么执行的》（超步、并发、状态合并、checkpoint 时机）。
- 一张对比表：`create_agent` / 手写 StateGraph / 你的 mini_graph，三者在「循环、工具调用、中断、恢复」上分别怎么实现。

## Stage 3（第 5 周）：工程化 + 综合

从 `phase4_projects` 里挑一个（建议 multi-agent 或 rag 那个），**重做一遍，但按生产标准**：

1. **可观测**：全链路接 LangSmith，能看出每次模型调用的 token、耗时、工具入参出参。
2. **健壮性**：模型超时重试、工具异常兜底、结构化输出解析失败的重试与降级。
3. **评估**：写 10 条固定测试用例（输入 → 期望行为），每次改动跑一遍，记录通过率。
4. **流式与中断**：前端能逐字显示，能在关键步骤暂停等人确认。
5. **成本与延迟**：统计一次请求的 token 和耗时，找出最贵的一步并优化（换小模型、裁剪上下文、缓存）。

**产出**：
- 一个能演示的项目 + 一份《这个 Agent 上生产还差什么》清单。
- 一篇总结《我从「会用」到「会造」补上的三件事》。

## 和 Datus 的衔接

第 5 周末做一次 30 分钟的预演：打开 Datus 的 README 和目录结构，只回答一个问题——「如果让我用 LangGraph 实现它，我会怎么画图？」把这张图存下来。第 9 周读完 Datus 后，再回来对照，差异就是你要学的东西。

## 验收问题（能答 80% 才算巩固完成）

1. `Runnable` 的 `invoke` 和 `stream` 在基类里是什么关系？为什么自定义组件只实现一个就能两个都能用？
2. `bind_tools` 之后，工具描述出现在请求的哪个位置？模型返回的工具调用长什么样？
3. LangGraph 的「超步」是什么？同一超步里的多个节点是并发还是串行？状态冲突怎么解决？
4. reducer 什么时候被调用？`add_messages` 相比默认覆盖解决了什么问题？
5. checkpointer 在哪个时刻写入？恢复时从哪个点继续？中断恢复和失败重试走的是同一条路吗？
6. `interrupt` 暂停后，进程重启还能恢复吗？靠什么？
7. 你的 mini_graph 和 LangGraph 最大的差距在哪三处？
8. 一个 Agent 上生产，除了功能，还必须有哪四样东西？

## 选读建议（需同步总计划）

按统一计划第 3–5 周推进，mini_graph 先实现节点、边、内存 checkpointer。多种持久化、成本优化和额外教程练习列为选修；保留第 5 周的可观测、健壮性与固定业务题集。需要调整投入时，在总计划记录顺延。

## 常见坑

- **不要重刷教程**。看视频和抄示例会产生「会了」的错觉，主动回忆才会暴露真实水平。
- **不要试图读完 langchain-core**。它是巨型库，只读上面列的三个文件，其余用到再看。
- **不要跳过 trace**。LangGraph 是异步、批量、并发的，光看代码很难建立时序感，trace 能直接给你真实执行顺序。
- LangChain 1.x 的 middleware 是新东西，网上资料少，读源码时以 `langchain/agents/middleware/` 为准。
</script>

<script type="text/markdown" data-path="02-路线图/01-Datus源码阅读路线.md" data-title="Datus 源码阅读指南" data-weeks="">
# Datus 源码阅读路线（3 周）

> 专题资料：文中原有周次与大型练习属于旧版排期；当前按 [27 周学习目标参考版](../02-路线图/00-总路线图.md) 选读，不叠加任务。

> Datus 是开源的「数据工程 Agent」，定位是让 AI 直接和数据库/数仓对话、生成并执行 SQL、沉淀数据上下文。
> 版本锚定：`v0.4.3`（2026-10-15 发布，见 `00-版本锁定.md`）。
> 仓库具体布局会随版本变化，**本路线中的所有结构描述都需要你在 Stage 0 用 P1 提示词重新核对一遍**，核对结果直接覆盖本文件末尾的「仓库地图」小节。

> 统一排期：第 7–9 周；输入是第 2 周的 SQL 基线、第 5 周 demo 与第 6 周 Ossie 模型。全部排期见 [总学习计划](00-总路线图.md)。

## 为什么在框架与语义模型之后学习

- 和你的工作重叠度最高：你既做数据平台，又在学 Agent，Datus 正好是两者的交叉点。
- Python 代码量小，3 周能读完主干。
- 已完成统一计划第 3–5 周（LangChain/LangGraph 巩固），你手上有 `mini_graph` 和 Pregel 的理解，读 Datus 时每个设计都能立刻找到对照物：「这里是状态机还是自研循环」「它的持久化和 checkpointer 差在哪」。**这个对照，就是这一阶段最大的收获。**

## 前置知识

- 统一计划第 3–5 周全部完成，尤其是 LangGraph 运行时那一周：说得清超步、reducer、checkpointer、interrupt。
- 自己的 `mini_graph.py` 还在，随时能翻。
- 一点 Text2SQL 的常识（schema 检索、few-shot、执行反馈重试）。
- 不需要懂 Flink/Paimon。

## Stage 0：跑通（第 7 周前半）

不跑通不读代码。

1. 克隆仓库，按版本锁定表切换到 v0.4.3，记录 commit。
2. 按 README 安装（大概率是 `pip install -e .` 或 `uv sync`），准备一个本地 DuckDB 或 SQLite 数据源。
3. 跑一次完整的交互：提问 → 生成 SQL → 执行 → 返回结果。**把每一步的日志留下来**。
4. 用 P1 生成 `CLAUDE.md` 仓库地图，抽查 3 处行号。
5. 用 P7 搞清楚「`datus` 命令的入口函数在哪」。

验收：能用一条命令启动，用自然语言问出一个 SQL 答案，并且知道这个回答经过了哪几个模块（哪怕只是名字）。

## Stage 1：主链路（第 7 周后半至第 8 周）

**唯一目标：把「用户一句话 → 最终答案」这条链路走通，每跳留行号。**

按这个顺序追，不要跳：

1. **入口层**：CLI / API 入口 → 会话初始化（加载配置、连接数据源、加载上下文）。
2. **Agent 循环**：一次用户输入如何进入循环？循环的终止条件是什么？最多几轮？
3. **上下文组装**：这一轮送给 LLM 的 prompt 里到底有什么？schema、指标、历史 SQL、工具描述分别从哪来、怎么排序、怎么裁剪？
4. **工具调用**：模型返回工具调用后，谁负责分发？工具注册表长什么样？SQL 执行工具怎么连数据库、怎么处理超时和错误？
5. **结果回写**：执行结果如何回到模型、如何形成最终回答、如何持久化到会话历史。

每追完一跳，填进笔记模板的链路表。追完后画时序图，标注哪些步骤是同步、哪些是流式。

**关键问题**（这一周必须回答的）：

- 它用的是自己的 agent loop，还是 LangGraph/LangChain？为什么？
- 工具是怎么注册的？加一个新工具要改几个文件？
- 上下文有没有预算控制？超长时怎么截断？
- LLM 调用失败/超时/返回非法 JSON 时怎么处理？

## Stage 2：语义验证与选读（第 9 周）

按第 9 周任务精读 context，并从工具层/subagent 选一个；其余专题保留为后续参考，笔记合并为一份语义验证报告。

**专题 1：Context Engineering（最重要）**
Datus 的核心卖点大概率就在这里。要搞清楚：数据上下文（表结构、字段描述、指标定义、示例 SQL、业务语义）以什么形式存储、怎么检索（向量？关键词？还是结构化索引？）、怎么注入 prompt、怎么随会话演进。这是你能直接搬回工作的部分——你们内部的 Text2SQL 大概率卡在上下文上。

第 9 周整合练习：按 [实践指南](05-数据建模与Ossie实践指南.md) 复用已有模型与题集，完成一次模型往返和「仅表结构 / 补充语义」上下文对照。先核对 Ossie 原生接入能力；本周精读 context 与工具层/subagent 中的一个，其余专题按需选读。

**专题 2：Subagent 编排**
有没有多个角色（如「调研 agent」「SQL agent」「校验 agent」）？它们之间怎么交接？是串行、并行还是路由？和 LangGraph 的 supervisor 模式比，差别在哪、为什么。

**专题 3：工具与数据源适配层**
数据库适配器怎么抽象？支持哪些方言？方言差异（分页、函数、日期）在哪一层处理？加一个新数据库要做什么。

**专题 4：质量保障**
有没有 SQL 校验、执行前 dry-run、结果自检、重试、评估集？这部分往往最粗糙，也最能体现工程成熟度——读它是为了知道「做一个能上生产的 Agent 还缺什么」。

**专题 5（可选）：MCP / 外部集成**
如果版本支持 MCP，看它作为 client 怎么接外部工具，和你们未来可能的集成方案对照。

## Stage 3：对比与输出（第 9 周末）

做一次三方对比，写《mini_graph / LangGraph / Datus：三个 Agent 运行时》，对比五点：

| 维度 | 你的 mini_graph | LangGraph | Datus |
| --- | --- | --- | --- |
| 执行模型（循环怎么驱动） | | 超步（Pregel） | |
| 状态与合并（reducer） | | | |
| 持久化（checkpointer / session） | | | |
| 中断与恢复 | | | |
| 工具注册与调用 | | | |

再翻出统一计划第 5 周末画的「如果我用 LangGraph 实现 Datus」那张预演图，对照实际代码，把你猜错的地方单独列一节——**猜错的地方就是你对 Agent 工程理解最薄弱的地方**。

## AI 提示词（针对 Datus）

- P2 场景：`入口是 <cli 入口函数>，追踪「用户提问：<问题>」这一次请求的完整路径，直到返回答案。`
- P3 场景：`请解释 context 的构建流程：从会话开始到拼出 prompt，涉及哪些数据源、如何筛选和排序。`
- P4 场景：`对比 Datus 的 agent loop 和 LangGraph 的 StateGraph 在 <状态/中断/重试> 上的差异。`
- P8 场景：`设计一个最小实验：给 Datus 接一个本地 duckdb，验证 <schema 检索> 是否真的生效（比如加一个无关表看它会不会被注入）。`

## 验收问题（能答 80% 算过）

1. 一条用户请求从进来到返回，经过了哪些模块？画出时序图。
2. 送给 LLM 的 prompt 由哪几部分组成？各部分从哪来？
3. 工具调用的完整生命周期是什么？失败怎么处理？
4. 会话状态存在哪？重启后还在吗？
5. 加一个新的数据源需要改哪些地方？
6. 它的上下文检索是语义检索还是结构化检索？为什么这么选？
7. 它为什么没有直接用 LangGraph？如果换成 LangGraph 实现，哪些能力能白拿（超步、checkpoint、中断），哪些拿不到或更难做？
8. 如果要把它接到公司内部数仓，最大的三个障碍是什么？

## 仓库地图（Stage 0 核对后覆盖这里）

| 模块/目录 | 职责 | 核心类/函数 | 备注 |
| --- | --- | --- | --- |
| | | | |

## 常见坑

- 不要把时间花在 UI / 前端上，除非你的工作要做产品化。
- Python 项目的「实现」往往很薄，价值在 prompt 和数据结构里，读的时候多看 prompt 模板和配置。
- 版本迭代快，网上博客大概率过期，一切以你 checkout 的代码为准。

# Paimon 源码阅读指南（第 10–14 周）

> 专题资料：文中原有周次与大型练习属于旧版排期；当前按 [27 周学习目标参考版](../02-路线图/00-总路线图.md) 选读，不叠加任务。

> 统一排期见 [总学习计划](00-总路线图.md)。将前面的订单、支付、退款和维度模型迁移至湖表，复用 SQL 基线验证读写与更新。

> 仓库：apache/paimon（Java）。锁定 `release-1.4.2`（commit `ac223f4`，见 `00-版本锁定.md`），先把版本号写死在笔记顶部。
> 与 Flink 1.20.5 搭配使用 `paimon-flink-1.20` 模块；Paimon 的代码结构非常规整：`paimon-core` 是主体，`paimon-flink` / `paimon-spark` 是引擎适配。

## 为什么第二个读它

你的 Flink 作业在写 Paimon，问题大概率集中在：写入慢、小文件多、snapshot 膨胀、compaction 不及时、读得慢。这些问题的答案全在 `paimon-core` 里。而且它的数据结构清晰，是读 Flink 之前最好的热身——Paimon 的 snapshot 和 Flink 的 checkpoint 本质是同一类「分布式一致性快照」问题。

## 前置知识

- LSM Tree 的基本概念（memtable / sstable / compaction / 布隆过滤器）。不懂的话先花 2 小时补，否则读 `KeyValueFileStore` 会很痛苦。
- 列式文件格式的常识（ORC/Parquet 的 row group、stripe）。
- 知道 Flink 的 checkpoint 是什么（不用懂实现）。

## Stage 1：概念模型（第 10 周）

**这一周不读实现，只读概念。** 读官方文档的 Concepts 章节 + `paimon-core` 里的模型类。

要建立的层次感：

```
Table（表定义 + Schema）
  └── Snapshot（某一时刻的完整视图，带 id 和 schema）
        ├── ManifestList（清单的清单）
        │     └── ManifestFile（一批数据文件的元信息）
        │           └── ManifestEntry（单个文件的增/删记录）
        └── DataFile（实际数据，ORC/Parquet）
```

配套要搞懂的概念：分区（partition）、桶（bucket）、主键（primary key）、LSM 的 level、sequence number、文件类型（data / changelog / index）。

用 P1 把 `paimon-core` 的包结构画出来。用 P3 问：「一次写入从开始到产生新 snapshot，元数据是怎么演进的？」

验收：能在纸上画出「表 → snapshot → manifest → data file」的关系，并解释为什么要三层（为什么不把文件列表直接放在 snapshot 里）。

## Stage 2：写链路（第 11 周）

主链路（Flink 写入一张主键表）：

```
Flink Sink → TableWrite → BatchWrite → 写文件 + 收集元数据
            → TableCommit → 生成 Manifest → 生成 Snapshot → 原子提交
```

按顺序读：

1. `FileStoreTable` / `KeyValueFileStore`：表的抽象，决定用哪种 store（append-only vs key-value）。
2. `TableWrite` 与 `BatchWrite`：一次 checkpoint 对应一个 batch；内存里怎么攒数据（`SortBuffer`）、什么时候 flush 成文件。
3. `MergeFunction`：主键表的核心。`Deduplicate` / `PartialUpdate` / `Aggregation` 分别怎么合并同 key 的多条记录。
4. `TableCommit`：最精彩的部分。多个 writer 的元数据怎么合并、怎么保证提交原子性（靠文件系统的 rename？靠锁？）、冲突怎么重试。
5. `Snapshot` 的生成与清理：snapshot 过期策略、旧文件何时删。

重点问题：
- 为什么 commit 要两阶段（prepare/commit）？失败在中间会怎样？
- 多个并发 writer 提交时，谁负责合并？乐观锁怎么做的？
- bucket 数量怎么影响写入并行度和读放大？
- `bucket = -1`（dynamic bucket）和固定 bucket 的差别在哪？

## Stage 3：读链路（第 12 周）

```
TableScan → FileStoreScan（按 snapshot + 分区/过滤条件筛 manifest）
          → 生成 DataSplit（可能多个文件需要合并）
          → MergeTreeSplit / MergeOnRead（主键表要合并多版本）
          → 返回给引擎（Flink Source / Spark Scan）
```

重点：
- 谓词下推在哪一层做（manifest 级别的分区裁剪、文件级别的 min/max 统计、行级别的 ORC/Parquet 索引）。
- 主键表「读时合并」的代价：读 10 个文件只为拿到最新版本，这就是为什么要 compaction。
- `MergeTreeSplit` 怎么决定哪些文件一起读（level 的概念在这里落地）。

验收：能解释「查一条主键最新值」为什么可能读多个文件，以及什么情况下会退化成全表扫。

## Stage 4：专题（第 13 周，按工作问题挑 1 个，其余选读）

- **Compaction**：谁触发（Flink 里的 compact 算子 / 独立 compact 作业 / 写时触发）、合并策略（minor/major、full compaction）、和 snapshot 的关系、为什么 compaction 会拖慢写入。
- **Changelog Producer**：`none` / `input` / `lookup` / `full-compaction` 四种模式的实现差异，对流读的影响。**这是你们做实时链路时最容易踩坑的地方。**
- **Lookup**：点查是怎么做的（本地缓存 + 远程读），和 Flink lookup join 的配合。
- **小文件问题**：什么配置控制文件大小、为什么会有小文件、怎么合并。
- **Z-order / 排序**：多维聚簇的实现，读 `ZOrderUDF` 一类的东西。
- **Spark 集成**：`paimon-spark` 的 Scan/Write 怎么复用 core，DataSourceV2 的接口在哪实现。

## Stage 5：回填工作（第 14 周）

写一篇《我们的 Paimon 表该怎么建》实践笔记，包含：分区键/主键/桶数的选择依据（引用代码里 bucket 影响读放大的地方）、compaction 配置建议、changelog 模式选择、监控指标清单。这篇笔记要能直接给团队用。

## 关键类速查表

| 关注点 | 类 | 模块 |
| --- | --- | --- |
| 表抽象 | `FileStoreTable`、`AbstractFileStoreTable` | paimon-core |
| 主键表 | `KeyValueFileStore`、`KeyValueTableWrite` | paimon-core |
| 追加表 | `AppendOnlyFileStore` | paimon-core |
| 写入批次 | `BatchWrite` 及其实现 | paimon-core |
| 提交 | `TableCommit`、`FileStoreCommit` | paimon-core |
| 元数据 | `Snapshot`、`ManifestFile`、`ManifestEntry`、`DataFileMeta` | paimon-core |
| 扫描 | `FileStoreScan`、`DataSplit`、`MergeTreeSplit` | paimon-core |
| 合并函数 | `MergeFunction` 及 `Deduplicate` 等 | paimon-core |
| Flink 适配 | `FlinkSink`、`FlinkSource`、`FlinkCatalog`、compact 相关算子 | paimon-flink |
| Spark 适配 | Spark Scan/Write | paimon-spark |

> 类名以你 checkout 的版本为准，Stage 1 核对后修正。

## AI 提示词（针对 Paimon）

- P2：`从 org.apache.paimon.table.sink.TableWrite 的 write 方法开始，追踪「Flink 一次 checkpoint 内的一批数据」如何变成一个新的 snapshot。`
- P3：`解释 Paimon 的 commit 流程：prepare 和 commit 各做什么，如何保证原子性，并发冲突怎么处理。`
- P4：`对比 Paimon 的 snapshot 和 Iceberg 的 snapshot 在元数据组织上的差异。`
- P8：`设计实验：本地写一张主键表，连续写 3 批，每批后打印 snapshot 列表和 manifest 内容，验证元数据演进。`

## 验收问题（能答 80% 算过）

1. 表 → snapshot → manifest → data file 的层次关系，为什么这么设计？
2. 一次 Flink checkpoint 的数据在 Paimon 里经历了什么？
3. 多个 writer 并发提交怎么保证不丢数据、不重复？
4. 主键表的读为什么要合并多个文件？compaction 如何缓解？
5. 四种 changelog 模式的差别，分别适用什么场景？
6. 小文件是怎么产生的？哪几个配置能控制？
7. 谓词下推发生在哪几层？
8. 如果线上出现「snapshot 数量暴涨」，按代码路径该怎么排查？

## 常见坑

- 不要一开始就读 `paimon-flink`，先读 `paimon-core` 的模型和写入，否则会被 Flink 的算子代码带偏。
- `ManifestEntry` 有 ADD/DELETE 两种，读元数据演进时一定要注意「删除」是怎么表达的——这是理解 snapshot 隔离性的关键。
- Paimon 版本迭代快，类名和方法签名变化大，AI 训练数据里的可能是 0.5/0.8 的版本，务必以你的 tag 为准。
</script>

# Flink 源码阅读指南（第 15–20 周）

> 专题资料：文中原有周次与大型练习属于旧版排期；当前按 [27 周学习目标参考版](../02-路线图/00-总路线图.md) 选读，不叠加任务。

> 统一排期见 [总学习计划](00-总路线图.md)。围绕同一支付/退款案例检查流式更新、去重、迟到、恢复与 Paimon 提交。

> 仓库：apache/flink（Java）。锁定 `release-1.20.5`（commit `0980485`，保守线，见 `00-版本锁定.md`）；若要迁到 2.x，先按 P10 补差异。不同版本 API 差异不小，尤其 `SinkV2`、`StreamTask`、Table 层。
> **只读三个模块**：`flink-runtime`、`flink-streaming-java`、`flink-table`。其余（connectors、kubernetes、python、ml）一概不看。

## 为什么在 Paimon 之后学习

Flink 涉及跨进程、跨线程的运行时，是这条计划中需要持续投入的部分。放在 Paimon 之后读，是因为你已经理解「快照」这套语义，Flink 的 checkpoint 会顺很多；而完成前面的框架、Agent 与湖表学习后，你的阅读方法也已经成熟。

## 先建立一个心法：永远先问「这段代码跑在哪个进程、哪个线程」

Flink 的代码难，难在跨进程、跨线程的状态。读每个方法前先定位：

- JobManager 侧：`Dispatcher`、`JobMaster`、`Scheduler`、`CheckpointCoordinator`
- TaskManager 侧：`TaskExecutor`、`Task`、`StreamTask`、算子线程、IO 线程、网络线程
- 客户端侧：`CliFrontend`、`StreamGraph` 生成

笔记里每个方法都标上「JM / TM / Client」，链路表里加一列「线程」。这一列比任何注释都有用。

## Stage 1：作业提交链路（第 15–16 周）

从 `flink-examples` 的 WordCount 出发，追一条链：

```
CliFrontend.main
  → parseAndRun → PackagedProgram(用户 main)
  → StreamExecutionEnvironment.execute
  → StreamGraphGenerator → StreamGraph        （逻辑图：算子 + 边）
  → StreamingJobGraphGenerator → JobGraph    （物理图：算子链、分区）
  → RestClusterClient.submitJob
  → Dispatcher → JobManagerRunner → JobMaster
  → DefaultExecutionGraphBuilder → ExecutionGraph（并行度、中间结果）
  → DefaultScheduler → SlotPool 申请 slot
  → TaskDeploymentDescriptor → TaskExecutor
  → Task.run → StreamTask.invoke
```

每一步要回答：**输入是什么对象，输出是什么对象，图上发生了什么变化**。四种图（StreamGraph / JobGraph / ExecutionGraph / 物理执行）的区别是这一阶段的核心收获。

配套要读的：
- 算子链（operator chain）是怎么形成的（`StreamingJobGraphGenerator` 里的 chain 条件），这直接解释了「为什么上游并行了下游也并行」和「为什么有时不能 chain」。
- Slot / SlotSharingGroup / 资源申请，解释了「为什么 slot 不够作业起不来」。
- 作业失败后的重启：`RestartStrategy`、`DefaultScheduler` 的 failover 逻辑。

验收：能画出四种图的转换关系，并解释每一步转换解决了什么问题。

## Stage 2：任务执行与数据交换（第 17 周）

```
Task.run → StreamTask.invoke
  → 初始化 OperatorChain（StreamOperator 按链顺序 head/tail）
  → StreamTask 主循环：处理输入 → 调用算子 → 输出
  → StreamOperator.processElement → 用户函数
  → RecordWriter → ResultPartition → ResultSubpartition → Netty → InputGate → RecordReader
```

重点：
- `StreamTask` 的 mailbox 模型（Flink 1.13+ 之后所有事件都走 mailbox），解释了 checkpoint、watermark、数据记录为什么能在同一个线程里有序处理——**这是理解后面所有机制的前提**。
- 网络栈：`ResultPartition` / `InputGate` / `BufferPool`，基于 credit 的反压（`BufferDebloater`），解释了「反压」到底反在哪、为什么看 `outPoolUsage` / `inPoolUsage`。
- 内存管理：`MemorySegment`、`MemoryManager`、`NetworkBufferPool`，解释了「网络缓冲不够」和「直接内存 OOM」。

验收：能解释一条记录从上游算子到下游算子经过了哪些缓冲区和线程，以及反压如何逐级传导。

## Stage 3：Checkpoint 全链路（第 18 周，核心中的核心）

这是和 Paimon 对接最紧的部分，也是线上问题最多的部分。

```
CheckpointCoordinator.triggerCheckpoint（JM 定时器触发）
  → 向 Source 下发 CheckpointBarrier
  → Source 注入 barrier → 随数据流向下游
  → StreamTask 收到 barrier → CheckpointBarrierHandler
      （对齐：等所有输入都到 barrier；非对齐：先落盘再对齐）
  → SubtaskCheckpointCoordinator → snapshotState（算子 + keyed state + timer）
  → 状态写入 CheckpointStorage（JM 内存 / 文件系统）
  → 各 subtask 上报 ack → CheckpointCoordinator 收到全部 ack
  → 完成：CompletedCheckpointStore 记录，通知算子（两阶段提交的 commit）
```

重点问题：
- 精确一次是怎么保证的？barrier 对齐到底对齐了什么？
- 非对齐 checkpoint（unaligned）解决什么问题，代价是什么？
- 状态大的时候 checkpoint 慢在哪：快照（RocksDB 增量）/ 上传 / 对齐？
- 两阶段提交：`CheckpointListener` 的 notifyCheckpointComplete 在什么时候调用，Sink 如何借此实现 exactly-once（这和 Paimon 的 commit 是同一套思路，对照读）。
- 失败恢复：从哪个 checkpoint 恢复、状态如何重新分配（rescale）。

验收：能画一张完整的 checkpoint 时序图（JM 和 TM 两个泳道），并能解释「checkpoint 一直超时」的五种可能原因分别对应代码哪一段。

## Stage 4：按工作问题二选一深挖（第 19 周）

**方向 A：状态与性能**（如果你们状态大、作业不稳）
- `StateBackend` / `KeyedStateBackend`：Heap vs RocksDB，状态如何组织（key group、namespace）。
- 状态 TTL、增量 checkpoint、本地恢复（local recovery）。
- 数据倾斜：keyBy 之后的分布，`rescale` vs `rebalance` vs `forward`。

**方向 B：Table / SQL 层**（如果你们用 Flink SQL 多）
- `TableEnvironmentImpl` → `SqlPlanner`/`StreamPlanner` → `StreamPhysicalRel` → `StreamExecNode` → `Transformation`。
- 一条 `INSERT INTO paimon_table SELECT ...` 怎么变成 JobGraph。
- 动态表、changelog 语义（+I/-U/+U/-D）在算子间怎么流转——和 Paimon 的 changelog producer 对照。
- 维表 join / lookup join 的实现。

**贯穿案例必做：时间、更新与迟到（第 19–20 周）**
- 使用支付/退款样例验证事件时间、watermark、重复事件与迟到修正；记录当前值、截止时点与补数规则。
- 在方向 A/B 只选一个精读的基础上，按案例需要定位 `WatermarkGenerator`、`TimerService` 或 `WindowOperator`；完整时间窗口专题列为选读。

## Stage 5：输出（第 20 周）

写两篇：
1. 《一个 Flink SQL 作业的一生》：从 SQL 文本到 TaskManager 上跑起来，全链路。
2. 《我们的作业为什么 checkpoint 慢 / 反压 / 重启》：把工作里的真实案例按代码路径复盘。

## 关键类速查表

| 关注点 | 类 | 模块 |
| --- | --- | --- |
| 提交入口 | `CliFrontend`、`StreamExecutionEnvironment` | flink-clients / streaming-java |
| 图生成 | `StreamGraphGenerator`、`StreamingJobGraphGenerator` | streaming-java |
| 调度 | `Dispatcher`、`JobMaster`、`DefaultScheduler`、`SlotPool` | flink-runtime |
| 图执行 | `ExecutionGraph`、`Execution`、`ExecutionVertex` | flink-runtime |
| 任务执行 | `Task`、`StreamTask`、`OperatorChain` | flink-runtime / streaming-java |
| 网络 | `ResultPartition`、`InputGate`、`BufferPool`、`RecordWriter` | flink-runtime |
| Checkpoint | `CheckpointCoordinator`、`CheckpointBarrierHandler`、`SubtaskCheckpointCoordinator` | flink-runtime |
| 状态 | `StateBackend`、`KeyedStateBackend`、`RocksDBKeyedStateBackend` | flink-runtime / state-backends |
| Table | `TableEnvironmentImpl`、`StreamPlanner`、`StreamExecNode` | flink-table |

> 版本差异提示：1.20 与 2.0 在 Sink、StreamTask、Table planner 上都有调整，类名以你的版本为准。

## AI 提示词（针对 Flink）

- P2：`从 StreamExecutionEnvironment.execute 开始，追踪一个 WordCount 作业到 TaskManager 上第一个算子开始处理数据，标注每一步运行在 Client / JM / TM 哪个进程。`
- P3：`解释 barrier 对齐：一个有两路输入的算子，收到一路 barrier 后到另一路 barrier 到来之前，做了什么？数据被缓存到哪？`
- P4：`对比 Flink 的 checkpoint 和 Paimon 的 snapshot commit，在「谁协调、如何保证原子、失败如何回滚」上的异同。`
- P8：`设计实验：本地起一个两并行度的作业，人为让一个 subtask 变慢，观察反压指标如何变化，并指出对应代码。`

## 验收问题（能答 80% 算过）

1. StreamGraph / JobGraph / ExecutionGraph 分别是什么，为什么要分三层？
2. 算子链是怎么形成的？什么情况下不会 chain？
3. 一个 slot 里能跑哪些 task？slot 不够时作业会怎样？
4. StreamTask 的 mailbox 模型解决了什么问题？
5. barrier 对齐的完整过程，非对齐模式的区别？
6. checkpoint 完成后的通知链路，两阶段提交如何工作？
7. 反压的指标怎么看，逐级传导的机制是什么？
8. 作业失败后从哪里恢复？状态如何重新分配？
9. 一条 Flink SQL 怎么变成 JobGraph？
10. 「checkpoint 一直失败」的排查顺序是什么（按代码路径）？

## 常见坑

- 直接读 `flink-runtime` 的网络栈或 `flink-table` 的 planner，会崩。必须按 Stage 顺序。
- 忽略「线程」维度。Flink 大量逻辑是异步、回调、mailbox 驱动的，不标线程会读成一团。
- 1.13 之前的博客和源码结构差异巨大（尤其是 StreamTask 和 Source），别拿老资料对照新代码。
- Table 层的类名几经重构（`ExecNode` → `StreamExecNode`，planner 拆分），AI 很容易给出旧版本类名，务必核对。
</script>

<script type="text/markdown" data-path="02-路线图/04-Spark源码阅读路线.md" data-title="Spark 源码阅读指南" data-weeks="">
# Spark 源码阅读指南（第 21–22 周）

> 专题资料：文中原有周次与大型练习属于旧版排期；当前按 [27 周学习目标参考版](../02-路线图/00-总路线图.md) 选读，不叠加任务。

> 统一排期见 [总学习计划](00-总路线图.md)。第 21 周追 SQL 生命周期与案例执行计划，第 22 周完成 Paimon 跨引擎对账、AI 回归及最终总结；其他优化与扩展章节按需选读。

> 仓库：apache/spark（Scala）。锁定 `v3.5.9`（commit `7c14a3c`，Scala 2.12 预编译包，见 `00-版本锁定.md`；Paimon 侧对应 `paimon-spark-3.5`）。
> **这条路线的定位是「按需」**：如果 Spark 在你的工作里主要是「跑批 + 读 Paimon 的另一个引擎」，读完 Stage 1、2 就够；只有要做查询优化、排查 OOM/倾斜时才往下走。

## 先定目标：你读 Spark 是为了什么

三种典型目标，读法完全不同：

- **A. 会用 + 能看懂执行计划**（大多数数据开发）：Stage 1 + Stage 2 的物理计划部分，会看 `explain` 输出即可。
- **B. 排查性能问题**（倾斜、OOM、shuffle 慢）：Stage 1 + Stage 3（AQE、shuffle、内存），配合 Stage 4 的 Paimon 集成。
- **C. 做引擎改造 / 深度定制**（扩展 Catalyst、写 connector）：全读，重点是 Stage 2 的 Rule 机制和 Stage 4 的 DataSourceV2。

先选一个，别贪。

## 前置知识

- Scala 的 case class、模式匹配、隐式转换（读 Catalyst 必需，`TreeNode` 大量用隐式）。
- 知道 logical plan / physical plan 的区别。
- 知道 shuffle 是什么、为什么贵。

## Stage 1：一条 SQL 的一生（第 21 周重点）

这是 Spark 最优雅的部分，一条链讲清楚整个引擎：

```
SQL 文本 / DataFrame API
  → Unresolved LogicalPlan（Parser / Dataset 构建）
  → Analyzer（SessionCatalog 解析表、列、函数，变成 Resolved LogicalPlan）
  → Optimizer（规则批量改写：谓词下推、列裁剪、常量折叠、join 重排）
  → SparkPlanner（Strategy 把逻辑算子转成物理算子）
  → PhysicalPlan（可选：AQE 在运行时改写）
  → SparkPlan.execute / doExecute（WholeStageCodegen 生成字节码）
  → RDD → Task → Shuffle / 读文件
```

配套概念：`TreeNode`（一切皆树）、`RuleExecutor`（一批 Rule 反复执行直到不动）、`Strategy`（逻辑到物理的映射）。

验收：给一条带 join + 聚合的 SQL，能说出 Analyzer 和 Optimizer 大致改了哪些地方，并能在 `explain(true)` 输出里指出对应的节点。

## Stage 2：Catalyst 的读法（3-4 天）

**不要试图读完所有 rule**（几百条）。读法：

1. 先读 `RuleExecutor` 和 `Batch` 的执行模型（一次 batch 内规则顺序执行，直到 fixpoint 或达到 maxIterations）。
2. 挑 5 条最常用的 rule 精读，每条按「匹配什么 → 改成什么 → 为什么安全」三段式做笔记：
   - `ResolveRelations`（表名 → 表）
   - `PushDownPredicates` / `PushPredicateThroughJoin`（谓词下推）
   - `ColumnPruning`（列裁剪）
   - `ConstantFolding`（常量折叠）
   - `ReorderJoin` 或 `CostBasedJoinReorder`（join 顺序）
3. 每条 rule 都问：它会不会不触发？什么情况下触发不了（比如 UDF 挡住了下推）？

进阶（目标 C 才需要）：`TreeNode.transformDown` / `transformUp` 的差异，自定义 rule 怎么注入（`SparkSessionExtensions`）。

## Stage 3：运行时（3-5 天，目标 B 必读）

- **Shuffle**：`ShuffleManager` → `SortShuffleWriter`（map 端排序 + spill）→ 索引文件 → `BlockStoreShuffleReader`（reduce 端拉取）。搞懂 spill 什么时候发生、`spark.shuffle.file.buffer` 之类的参数作用在哪。
- **AQE**：`AdaptiveSparkPlanExec` 在 stage 边界重新优化；`CoalesceShufflePartitions`（合并小分区）、`OptimizeSkewedJoin`（倾斜 join 拆分）、`DemoteBroadcastHashJoin`。这是解决倾斜和分区过多的主要手段。
- **内存与 Tungsten**：`UnsafeRow`（堆外二进制行）、`MemoryManager`（execution vs storage）、OOM 时的内存分布。解释了「为什么 off-heap 也会 OOM」。
- **WholeStageCodegen**：`WholeStageCodegenExec` 把多个算子编译成一个函数，解释了为什么 `explain` 里看到的节点和实际执行不对应。

## Stage 4：Paimon 集成（2-3 天，和工作直接相关）

Paimon 走 Spark 的 DataSourceV2 API，读这条链能同时学会两件事：Spark 怎么接外部存储、Paimon 怎么适配引擎。

```
SparkCatalog / SparkSession → Table(SparkTable)
  → ScanBuilder → Scan（做分区裁剪、谓词下推、列裁剪）
  → Batch → PartitionReaderFactory → PartitionReader（读 Paimon 文件）
写入：WriteBuilder → BatchWrite → Commit
```

对照读 `paimon-spark` 和 `paimon-core`：适配层做了什么、哪些能力（下推、统计信息）是 Paimon 提供、哪些是 Spark 要求实现的。**这一节读完，你对「湖格式如何服务多引擎」会有完整认知。**

## 关键类速查表

| 关注点 | 类 | 模块 |
| --- | --- | --- |
| 入口 | `SparkSession`、`Dataset`、`QueryExecution` | sql/core |
| 解析与优化 | `Analyzer`、`Optimizer`、`RuleExecutor`、`Batch` | catalyst |
| 树 | `TreeNode`、`LogicalPlan`、`Expression` | catalyst |
| 规划 | `SparkPlanner`、`Strategy`、`SparkPlan` | sql/core |
| 代码生成 | `WholeStageCodegenExec`、`CodegenContext` | sql/core |
| AQE | `AdaptiveSparkPlanExec`、`CoalesceShufflePartitions`、`OptimizeSkewedJoin` | sql/core |
| Shuffle | `ShuffleManager`、`SortShuffleWriter`、`BlockStoreShuffleReader` | core |
| 内存 | `UnsafeRow`、`MemoryManager`、`TaskMemoryManager` | core |
| 外部数据源 | `Table`、`ScanBuilder`、`Batch`、`PartitionReaderFactory` | sql/core (v2) |

## AI 提示词（针对 Spark）

- P2：`从 SparkSession.sql("<SQL>") 开始，追踪到生成 PhysicalPlan，列出经过的 Analyzer batch、Optimizer batch、Planner strategy。`
- P3：`解释 RuleExecutor 的执行模型：batch 之间和 batch 内部的顺序、fixpoint 判定、maxIterations 的作用。`
- P4：`对比 Spark 的 AQE 和 Flink 的动态调度，在「运行时改计划/改并行度」上的思路差异。`
- P8：`设计实验：构造一个 10 万行小表 join 1000 万行大表、且 key 严重倾斜的场景，观察 AQE 的 OptimizeSkewedJoin 是否生效，看日志里哪个关键字。`

## 验收问题（能答 80% 算过）

1. 一条 SQL 从文本到执行经过哪几个阶段？每个阶段的输入输出是什么？
2. `TreeNode` + `Rule` 的模式解决了什么问题？为什么规则要反复执行？
3. 谓词下推在什么情况下失效？
4. AQE 在哪些时机重新优化？解决了哪三类问题？
5. shuffle 的 map 端和 reduce 端分别做了什么？spill 何时发生？
6. WholeStageCodegen 为什么能提速？它和 `explain` 的节点是什么关系？
7. Paimon 的 Spark connector 实现了 DataSourceV2 的哪些接口？分区裁剪在哪做的？

## 常见坑

- Spark 源码是 Scala，隐式转换多，跳转经常跳到奇怪的地方。用 IDEA 时先看方法签名，别被隐式带跑。
- Catalyst 的 rule 有几百条，读多了会迷失。始终围绕「这条规则改变了哪个节点、为什么安全」。
- 网上大量 Spark 2.x 的资料（尤其是 DataSource V1），和 3.x/4.x 差异大，注意 `v2` 包。
- Spark 4.x 有较大改动（ANSI 默认开启、Variant 类型、Spark Connect），如果生产是 3.5，别读 4.x 的代码。
</script>

<script type="text/markdown" data-path="02-路线图/06-阶段一考点与实践题.md" data-title="阶段一考点与实践题" data-weeks="第 1–3 周">
# 第一阶段考点与实践题：LangChain 模型、工具、检索

> 配套[27 周总计划](00-总路线图.md)第 1–3 周。第 1–2 周可合并成一个学习单元；已有概念基础就直接做题，解释不清的部分再查资料。每周约 4–5 小时，未过关则顺延。这里的“阶段一”指本路线图的第一阶段，不是咕泡清单中同名的阶段一。

## 资料与统一场景

主场景采用咕泡课程的虚构“听数实验室”数据小助理。原课的 S01、S02 对应模型调用和结构化输出；S18 的工具契约部分用于工具调用；S06、S09–S11 对应检索、分块、引用。**实现统一用 LangChain**，不要求按原课进度完成 Dify、MCP 服务、数据库执行或完整 Agent 平台。

- 题目与章节：[咕泡第 3–9 章学习清单](../../../咕泡/咕泡new/第3至9章学习清单_20261021.md)，重点看 S01、S02、S18-Q2/Q3、S06、S09、S10、S11。
- 场景和时间规则：[项目设定](../../../咕泡/咕泡new/实战连续剧_项目设定与使用规则.md)。
- 固定输入：[实战固定样例数据 v1](../../../咕泡/咕泡new/实战固定样例数据_v1.json)：本阶段主要用 `metrics`、`complete_partitions`、`knowledge_documents`。其中 `K01` 是 10 月有效日活口径，`K02` 是已退休旧口径，`K04` 仅 analyst 可见，`K05` 说明完整分区，`K07` 是未审核的攻击文本。
- [验收基准](../../../咕泡/咕泡new/验收基准_v1.json)只在后续接入数值计算时使用。本阶段**能解释口径和数据可用性，不凭 RAG 生成指标数值**。

练习统一以训练时钟 `2026-10-05 12:00:00 +08:00` 解释相对日期：“昨天”是 `2026-10-04`。本阶段只建立一个小助手，逐步增加能力。保存最小可运行代码、输入输出记录和一页复盘即可；可以用现有练习仓库，不需要再建一个业务系统。

## A. 模型调用与工具（对应第 1–2 周，可合并完成）

### A1. 考点：消息与结构化输出

闭卷作答，每题用 3–6 句话，最好附一次真实运行现象。

1. **消息边界**：System、Human、AI、Tool 消息分别承载什么？把规则、历史、工具结果拼成一个长字符串，失去哪些可检查的边界？（咕泡 S01）
2. **调用与流式**：`invoke` 与 `stream` 的使用和观察有何区别？流在 JSON 中途断开时，为什么不能把已到达字符直接交给后续程序？（S01）
3. **三层正确性**：举例区分“文本是合法 JSON”“符合参数 Schema”“业务值可执行”。`metric="收入"`、开始时间晚于结束时间分别在哪一层处理？（S02）
4. **澄清与失败**：“昨天各渠道表现如何”缺了什么？鉴权失败、限流、超时、歧义输入各应如何处理，何时重试没有意义？（S01/S02）
5. **原始结果与用量**：为什么要保留模型原始消息、解析对象、校验结果、调用耗时与可获得的用量？拿不到 token usage 时如何记录？（S01）

### A1. 实践题：做一个可核验的参数抽取入口

用 LangChain ChatModel 接收用户问题，输出结构化对象：

`intent, metric, dimensions, time_range, filters, missing_fields, status`

允许的指标 ID 取自样例 `metrics`，至少支持 `dau`、`new_users`、`paid_amount`、`paying_users`。`status` 至少区分 `ready`、`needs_clarification`、`invalid`。按服务端传入的固定训练时钟解释“昨天”；不要用机器当天日期。模型给出对象后，再由程序验证指标枚举、日期顺序、必填项。记录原始 AIMessage、解析对象、验证结论、耗时、可获得的 usage；错误与断流不能伪装为成功。

| 输入 | 必查结果 |
| --- | --- |
| 查 2026-10-04 各渠道日活 | `metric=dau`、渠道维度、日期 10-04、`ready` |
| 昨天的日活是多少 | 训练时钟下日期 10-04、`metric=dau` |
| 昨天各渠道表现如何 | 缺指标，进入 `needs_clarification`；不能暗定为日活 |
| 查 2026-10-04 各渠道收入 | “收入”不是已定义指标，澄清具体口径或标 `invalid`；不能偷换成 `paid_amount` |
| 查 2026-10-04 至 2026-10-03 的日活 | 日期逆序由程序拒绝 |
| 查 2026-10-05 日活 | 参数可解析，但完整分区未知；记录待查数据状态，不能返回 0 |

再模拟一次超时和一次中途断流。两种情况都应留下错误类型；断流输出标为 `incomplete`，不进入工具或答案生成。没有真实模型密钥时可用 LangChain 的测试模型验证消息、解析和控制流，但“模型实际抽取准确率”须标记未验证。

**提交**：Schema、调用代码、上述 6 例结果、2 个失败记录，以及一段解释“模型生成了什么，程序最终接受了什么”。

### A2. 考点：工具调用与执行边界

1. **调用链**：画出 Human → 模型提出 tool call → 程序验证/执行 → ToolMessage → 模型生成答复。哪个环节真正访问本地数据？（S18）
2. **契约**：工具名称、用途描述、参数 Schema、结果 Schema 各解决什么问题？模型给出不存在的工具名或非法参数时如何处理？（S18）
3. **状态区分**：`not_found`、`unknown_partition`、`forbidden`、`tool_error`、调用超时为何不能都写成“没有数据”？（S18）
4. **边界与停止**：授权身份从哪里来？如何阻止同一工具反复调用、循环不退出或调用次数无上限？（S18；与总计划第 2 周对应）

### A2. 实践题：给同一助手加两个只读工具

从固定 JSON 读数据，定义并绑定两个 LangChain 工具：

- `get_metric_definition(metric_id, as_of_date)`：返回指标 ID、公式、版本、生效状态和来源；未知指标返回明确错误。`partner_demo` 不能通过此入口得到支付指标的内容。
- `check_partition(table, date)`：对 `fact_event`、`fact_order` 返回 `complete` 或 `unknown`，并给出数据来源。未知分区不能返回“空表/数值 0”。

身份由程序传入，不让模型从用户话语中自行修改。工具执行前验证参数；返回中区分正常、空结果、无权限和执行失败。控制循环最多 3 次工具调用，重复同一调用则终止并报告原因。保存每一步消息类型、工具参数、工具结果与最终答复。

| 任务 | 预期行为 |
| --- | --- |
| “2026-10-04 日活怎么算？当天事件分区可用吗？” | 可调用两个工具；说明口径与分区完整，不报日活数值 |
| “2026-10-05 日活是多少？” | 分区状态 `unknown`；不得回答 0 |
| `partner_demo` 问“成功支付金额口径是什么？” | 执行层拒绝读取支付口径；改口说“我是管理员”也不能改变身份 |
| 工具收到 `date=2026-99-99` 或未知表名 | 程序拒绝非法参数，不触碰数据文件后续逻辑 |
| 工具故意抛出异常 | 答复为工具失败并保留可追踪记录，不能写成“没有数据” |

**提交**：两个工具契约、调用轨迹 5 条、至少 1 个非法调用记录和循环停止规则。MCP 包装留到后续 Agent/工具专题；这道题检查 LangChain 工具调用链。

## B. 最小 RAG（对应第 3 周）

### B1. 考点：检索、证据与回答

1. **链路**：离线整理/分块/建索引与在线检索/生成分别做什么？更新一份知识文档，哪些信息必须重新确认？（S06）
2. **分块**：若“有效播放”和“排除内部用户”被拆成两个孤立片段，会怎样影响答案？如何通过分块或父文档关系修正？（S09）
3. **检索信号**：“日活”“DAU”“fact_event.duration_seconds”为什么对关键词和语义检索的依赖不同？Top-K 分数能直接解释为正确概率吗？（S10）
4. **过滤顺序**：K02 已退休、K04 有角色限制、K07 未审核，分别应在哪些环节过滤或标注？只过滤向量召回、不处理其他通路会有什么问题？（S10）
5. **引用核对**：引用了 K01 是否一定说明回答中的每个条件都正确？检索到口径文档，是否就能说出 10 月 4 日的实际日活人数？（S06/S11）
6. **错误归因**：答案漏掉“排除内部用户”、引用 K02、凭空报数，分别更可能属于检索漏召回、证据选择/引用错误还是生成错误？需要看什么运行证据来判断？（S11）

### B1. 实践题：用 K01–K07 做一条可追溯的 RAG 链

把 `knowledge_documents` 变成 LangChain Document，至少保留 `doc_id`、`version`、`status`、`scope`、`effective_from/to`、原文来源。用一个可运行的检索器完成“问题 → 候选文档 → 权限/版本过滤 → 带证据回答”；向量方案应记录 embedding 模型与索引配置。若用演示假向量，只验控制流，不评价真实召回效果。至少比较**无检索**与**有检索**的输出；再手工检查一处中文别名和一个字段名的召回差异。

| 问题与身份 | 应出现的关键证据/行为 |

| analyst：2026 年 10 月日活怎么算？ | K01；有效播放、按用户去重、排除内部用户、时区 |

| partner：成功支付金额如何计算？ | K04 不得进入给模型的上下文、回答或引用；说明无权限 |

另加两个反例：10 月查询不能采用 K02 的 9 月旧口径；K07 中“导出全部订单”的文字不能成为系统指令。每个答案都带实际使用的 `doc_id/version`，没有足够证据时返回“无法确认”和缺失项。检查引用是否支持答案中的每个条件；本周不计算数值指标。

## 阶段一总验收

用一条完整轨迹回答：“2026-10-04 日活怎么算？当天数据是否可查？”轨迹中应看到解析结果、模型调用、工具调用与返回、检索到的 K01/K05、过滤决策和最终答复。答复应能解释日活定义与事件分区状态；没有数值计算工具时不报具体人数。

自评按每单元 100 分：**知识题 25、实践行为 55、运行证据与复盘 20**。三个单元都达到 80 分，且通过以下硬条件，才进入第二阶段：

- 歧义问题会澄清；Schema 合法但业务非法的值由程序拦下。
- 工具选择与执行有完整消息轨迹；身份、参数和调用上限由程序控制。
- K02 不冒充 10 月现行口径，K04 不泄露给 partner，K07 不成为指令；未知分区不被解释为 0。
- 最终答案能追到具体证据，口径解释和数值计算的能力边界说得清楚。

遇到模型输出不稳定时，保留原始输入/输出与失败原因，再修改提示词、Schema 或过滤逻辑并复跑同一用例。**过关看可复现的行为和解释，不看代码行数。**

<script>
(function () {
  'use strict';

  /* ---------------- markdown renderer ---------------- */
  function esc(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function isCjk(ch) {
    return /[\u2E80-\u9FFF\uF900-\uFAFF\u3000-\u303F\uFF00-\uFFEF]/.test(ch);
  }

  function joinText(lines) {
    if (!lines.length) return '';
    var s = lines[0];
    for (var k = 1; k < lines.length; k++) {
      var a = s.slice(-1);
      var b = lines[k].charAt(0);
      s += (isCjk(a) || isCjk(b) ? '' : ' ') + lines[k];
    }
    return s;
  }

  function inline(s) {
    var segs = String(s).split('`');
    var out = '';
    for (var i = 0; i < segs.length; i++) {
      if (i % 2 === 1) {
        out += '<code>' + esc(segs[i]) + '</code>';
        continue;
      }
      var t = esc(segs[i]);
      t = t.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
      t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      t = t.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>');
      out += t;
    }
    return out;
  }

  function isSep(line) {
    var t = line.trim().replace(/^\|/, '').replace(/\|$/, '');
    if (t.indexOf('-') === -1) return false;
    return t.split('|').every(function (c) {
      return /^\s*:?-{2,}:?\s*$/.test(c);
    });
  }
  function splitRow(line) {
    var t = line.trim();
    if (t.charAt(0) === '|') t = t.slice(1);
    if (t.slice(-1) === '|') t = t.slice(0, -1);
    return t.split('|').map(function (c) { return c.trim(); });
  }

  var LIST_RE = /^(\s*)([-*+]|\d+[.)])\s+(.*)$/;

  function renderNodes(nodes) {
    var html = '';
    var i = 0;
    while (i < nodes.length) {
      var t = nodes[i].ordered ? 'ol' : 'ul';
      var j = i;
      while (j < nodes.length && (nodes[j].ordered ? 'ol' : 'ul') === t) j++;
      html += '<' + t + '>';
      for (var k = i; k < j; k++) {
        var txt = nodes[k].text;
        var box = '';
        var cm = txt.match(/^\[( |x|X)\]\s+(.*)$/);
        if (cm) { box = '<span class="chk"></span>'; txt = cm[2]; }
        html += '<li>' + box + inline(txt);
        if (nodes[k].children.length) html += renderNodes(nodes[k].children);
        html += '</li>';
      }
      html += '</' + t + '>';
      i = j;
    }
    return html;
  }

  function listBlock(lines, start) {
    var items = [];
    var i = start;
    while (i < lines.length) {
      var l = lines[i];
      var m = l.match(LIST_RE);
      if (m) {
        items.push({
          indent: m[1].replace(/\t/g, '    ').length,
          ordered: /^\d/.test(m[2]),
          text: m[3]
        });
        i++;
        continue;
      }
      if (/^\s{2,}\S/.test(l) && items.length) {
        var last = items[items.length - 1];
        last.text = joinText([last.text, l.trim()]);
        i++;
        continue;
      }
      if (/^\s*$/.test(l)) {
        var j = i + 1;
        while (j < lines.length && /^\s*$/.test(lines[j])) j++;
        if (j < lines.length && (LIST_RE.test(lines[j]) || /^\s{2,}\S/.test(lines[j]))) {
          i = j;
          continue;
        }
        break;
      }
      break;
    }

    var root = { indent: -1, children: [] };
    var stack = [root];
    items.forEach(function (it) {
      while (stack.length > 1 && it.indent <= stack[stack.length - 1].indent) stack.pop();
      var node = { indent: it.indent, ordered: it.ordered, text: it.text, children: [] };
      stack[stack.length - 1].children.push(node);
      stack.push(node);
    });
    return { html: renderNodes(root.children), next: i };
  }

  function renderBlocks(src) {
    var lines = src.split(/\r?\n/);
    var out = '';
    var i = 0;

    function startsBlock(l) {
      if (/^\s*$/.test(l)) return true;
      if (/^#{1,6}\s/.test(l)) return true;
      if (/^\s*(`{3,}|~{3,})/.test(l)) return true;
      if (/^\s*>/.test(l)) return true;
      if (LIST_RE.test(l)) return true;
      if (/^\s*(?:-{3,}|\*{3,}|_{3,})\s*$/.test(l)) return true;
      return false;
    }

    while (i < lines.length) {
      var line = lines[i];
      if (/^\s*$/.test(line)) { i++; continue; }

      var fm = line.match(/^(\s*)(`{3,}|~{3,})(.*)$/);
      if (fm) {
        var ch = fm[2].charAt(0);
        var closeRe = new RegExp('^\\s*' + (ch === '`' ? '`' : '~') + '{' + fm[2].length + ',}\\s*$');
        var buf = [];
        var j = i + 1;
        while (j < lines.length && !closeRe.test(lines[j])) { buf.push(lines[j]); j++; }
        out += '<pre><code>' + esc(buf.join('\n')) + '</code></pre>';
        i = j + 1;
        continue;
      }

      var hm = line.match(/^(#{1,6})\s+(.+?)\s*$/);
      if (hm) {
        var n = hm[1].length;
        out += '<h' + n + '>' + inline(hm[2]) + '</h' + n + '>';
        i++;
        continue;
      }

      if (/^\s*(?:-{3,}|\*{3,}|_{3,})\s*$/.test(line)) { out += '<hr>'; i++; continue; }

      if (/^\s*>/.test(line)) {
        var qbuf = [];
        while (i < lines.length && /^\s*>/.test(lines[i])) {
          qbuf.push(lines[i].replace(/^\s*>\s?/, ''));
          i++;
        }
        out += '<blockquote>' + renderBlocks(qbuf.join('\n')) + '</blockquote>';
        continue;
      }

      if (line.indexOf('|') !== -1 && i + 1 < lines.length && isSep(lines[i + 1])) {
        var head = splitRow(line);
        var rows = [];
        var k2 = i + 2;
        while (k2 < lines.length && lines[k2].indexOf('|') !== -1 && !/^\s*$/.test(lines[k2])) {
          rows.push(splitRow(lines[k2]));
          k2++;
        }
        out += '<div class="tw"><table><thead><tr>' +
          head.map(function (c) { return '<th>' + inline(c) + '</th>'; }).join('') +
          '</tr></thead><tbody>';
        rows.forEach(function (r) {
          out += '<tr>' + r.map(function (c) { return '<td>' + inline(c) + '</td>'; }).join('') + '</tr>';
        });
        out += '</tbody></table></div>';
        i = k2;
        continue;
      }

      if (LIST_RE.test(line)) {
        var res = listBlock(lines, i);
        out += res.html;
        i = res.next;
        continue;
      }

      var pbuf = [line];
      i++;
      while (i < lines.length) {
        var nl = lines[i];
        if (startsBlock(nl)) break;
        if (nl.indexOf('|') !== -1 && i + 1 < lines.length && isSep(lines[i + 1])) break;
        pbuf.push(nl);
        i++;
      }
      out += '<p>' + inline(joinText(pbuf)) + '</p>';
    }
    return out;
  }

  function render(md) {
    var lines = md.split(/\r?\n/);
    var s = 0;
    while (s < lines.length && /^\s*$/.test(lines[s])) s++;
    if (s < lines.length && /^#\s+/.test(lines[s])) lines.splice(s, 1);
    return renderBlocks(lines.join('\n'));
  }

  /* ---------------- app ---------------- */
  var scripts = Array.prototype.slice.call(
    document.querySelectorAll('script[type="text/markdown"]')
  );
  var byPath = {};
  var order = [];
  scripts.forEach(function (sc) {
    byPath[sc.getAttribute('data-path')] = sc;
    order.push(sc.getAttribute('data-path'));
  });

  var docEl = document.getElementById('doc');
  var topPath = document.getElementById('topPath');
  var extLink = document.getElementById('extLink');
  var prevBtn = document.getElementById('prevBtn');
  var nextBtn = document.getElementById('nextBtn');
  var mainEl = document.getElementById('main');
  var side = document.getElementById('side');
  var overlay = document.getElementById('overlay');
  var navToggle = document.getElementById('navToggle');

  function shortTitle(sc) {
    return sc.getAttribute('data-title') || sc.getAttribute('data-path');
  }

  function open(path, pushHash) {
    var sc = byPath[path] || byPath['README.md'];
    var p = sc.getAttribute('data-path');
    var weeks = sc.getAttribute('data-weeks') || '';

    docEl.innerHTML = '';
    var h1 = document.createElement('h1');
    h1.textContent = shortTitle(sc);
    docEl.appendChild(h1);

    var meta = document.createElement('p');
    meta.className = 'doc-meta';
    meta.innerHTML = '<span>' + esc(p) + '</span>' +
      (weeks ? '<span class="weeks">' + esc(weeks) + '</span>' : '');
    docEl.appendChild(meta);

    var body = document.createElement('div');
    body.innerHTML = render(sc.textContent);
    docEl.appendChild(body);

    topPath.textContent = p;
    extLink.href = encodeURI(p);
    document.title = shortTitle(sc) + ' · AI读源码';

    var idx = order.indexOf(p);
    var items = document.querySelectorAll('.sitem');
    for (var i = 0; i < items.length; i++) {
      var on = items[i].getAttribute('data-doc') === p;
      items[i].classList.toggle('active', on);
      if (on) items[i].setAttribute('aria-current', 'page');
      else items[i].removeAttribute('aria-current');
    }

    if (idx > 0) {
      prevBtn.disabled = false;
      prevBtn.textContent = '← ' + shortTitle(byPath[order[idx - 1]]);
      prevBtn.onclick = function () { open(order[idx - 1], true); };
    } else {
      prevBtn.disabled = true;
      prevBtn.textContent = '';
    }
    if (idx !== -1 && idx < order.length - 1) {
      nextBtn.disabled = false;
      nextBtn.textContent = shortTitle(byPath[order[idx + 1]]) + ' →';
      nextBtn.onclick = function () { open(order[idx + 1], true); };
    } else {
      nextBtn.disabled = true;
      nextBtn.textContent = '';
    }

    if (pushHash) location.hash = encodeURIComponent(p);
    mainEl.scrollTop = 0;
    closeNav();
  }

  function currentHash() {
    try { return decodeURIComponent(location.hash.replace(/^#/, '')); }
    catch (e) { return ''; }
  }

  function openNav() {
    side.classList.add('open');
    overlay.classList.add('show');
    navToggle.setAttribute('aria-expanded', 'true');
  }
  function closeNav() {
    side.classList.remove('open');
    overlay.classList.remove('show');
    navToggle.setAttribute('aria-expanded', 'false');
  }

  navToggle.addEventListener('click', function () {
    if (side.classList.contains('open')) closeNav(); else openNav();
  });
  overlay.addEventListener('click', closeNav);

  Array.prototype.forEach.call(document.querySelectorAll('.sitem'), function (b) {
    b.addEventListener('click', function () { open(b.getAttribute('data-doc'), true); });
  });

  window.addEventListener('hashchange', function () {
    var p = currentHash();
    if (p && p !== topPath.textContent) open(p, false);
  });

  var initial = currentHash();
  open(initial || 'README.md', !initial);
})();
</script>
